function deduplicateFoods(foods) {
  const merged = [];
  const seen = new Map();
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    const key = f.name.toLowerCase().trim() + "_" + f.calories + "_" + f.protein;
    if (seen.has(key)) {
      const existing = seen.get(key);
      if (existing.source.indexOf(f.source) < 0) existing.source += " \u2022 " + f.source;
    } else {
      const copy = Object.assign({}, f);
      seen.set(key, copy);
      merged.push(copy);
    }
  }
  return merged;
}

// How many grams the food's stored calories/protein/carbs/fat actually describe.
// Database foods (USDA / Open Food Facts) are per-100g. Everything the user creates -- manual
// entries, AI estimates, recipe logs, custom barcodes -- stores ABSOLUTE macros for one
// specific portion instead, so the portion has to be recoverable or the numbers get rescaled
// as though they were per-100g. That was a real bug: a 235 kcal / 83g item re-added from
// History came back as 235 * (83/100) = 195 kcal, because these foods recorded servingSizes: []
// (or omitted it) and the lookup fell through to 100.
// loggedWeight is the retroactive rescue for entries already saved in that broken shape -- for
// every path that stores absolute macros, loggedWeight is exactly the portion they belong to.
// The calories shown in a search-result row need a label that actually matches what the number
// means -- "kcal/100g" was hardcoded everywhere, which is only true for database (USDA/OFF)
// foods. Absolute-portion foods (Manual Entry, AI Estimate, Recipe, custom barcodes) were
// showing e.g. "235 kcal/100g" for a 235-calorie, 83g hot dog -- actively misleading, and the
// same wrong assumption that caused the calcMacrosForWeight rescaling bug above.
function foodQuantityLabel(food) {
  if (food.per100g) return "kcal/100g";
  const g = foodBaseGrams(food);
  return "kcal/" + round1(g) + "g";
}

// food.baseGrams is the EXPLICIT statement of "these macros describe N grams" and wins over
// everything below it, which are only inferences. It exists because the inferences are each
// derived from a field some other code path legitimately overwrites: re-logging a food rewrites
// loggedWeight, and correcting a custom food's macros rewrites the macro fields. Either one on
// its own silently re-anchors the food to a portion its numbers never described. See
// anchorFoodBase.
function foodBaseGrams(food) {
  if (!food) return 100;
  // parseFloat, not a bare `> 0`: this value round-trips through JSON in four different stores
  // and the return type is contracted as a number (callers hand it straight to round1 and to
  // division), so a stringified "166" must not leak out of here.
  const explicit = parseFloat(food.baseGrams);
  if (explicit > 0) return explicit;
  if (food.per100g) return 100;
  const serving = food.servingSizes && food.servingSizes[0] && food.servingSizes[0].grams;
  if (serving > 0) return serving;
  if (food.loggedWeight > 0) return food.loggedWeight;
  return 100;
}

// Returns a copy of `food` with its CURRENT base portion frozen into an explicit baseGrams,
// so a later write to loggedWeight (re-logging the same food at a different weight) can't move
// the anchor out from under the stored macros. Must be applied BEFORE loggedWeight is
// overwritten, which is why it lives at the clone sites rather than inside addFoodToLog.
// Also upgrades legacy records (saved before baseGrams existed) on their next use, since the
// inference chain still produces the right answer for a record nothing has re-anchored yet.
function anchorFoodBase(food) {
  return Object.assign({}, food, { baseGrams: foodBaseGrams(food) });
}

function calcMacrosForWeight(food, grams) {
  if (!food) return { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
  const base = foodBaseGrams(food);
  const mult = grams / base;
  return {
    calories: Math.round(food.calories * mult),
    protein: round1(food.protein * mult),
    carbs: round1(food.carbs * mult),
    fat: round1(food.fat * mult),
    fiber: round1((food.fiber || 0) * mult),
  };
}


// ============================================================
// TINY RENDER ENGINE
// A single root re-render on every state change. Uses event
// delegation on #app so we never need to worry about rebinding
// listeners after re-render.
// ============================================================
const root = document.getElementById("app");
let pendingFocusId = null; // element id to focus after next render
let barcodeStream = null; // live camera MediaStream while the barcode scanner is open
let barcodeDetectionRAF = null; // requestAnimationFrame handle for the scan loop

// ---- Toast (brief "Food Added" style confirmation) ----
let toastToken = 0;
function showToast(message) {
  const token = ++toastToken;
  state.toast = message;
  rerender();
  setTimeout(function() {
    if (toastToken === token) { state.toast = null; rerender(); }
  }, 900);
}

// ---- Back button / gesture navigation ----
// This app has no router, but the browser back button and edge-swipe gestures both fire
// the same popstate event, so we can intercept them without one. The model is 3 flat tiers:
// depth 0 = dashboard tab; depth 1 = any other tab at its base view; depth 2 = a Food-tab
// sub-screen (AI estimate, manual entry, barcode scan, wizard, recipe builder, etc). Every
// render() call pushes/resyncs history to match the current depth automatically -- so
// entering a deeper screen is always handled generically here, no matter which action got
// you there. Only the "step back" direction needs each screen's close/cancel/confirm action
// to opt in (call stepBackOneLevel()) instead of clearing its own flag directly, so that
// physical back-button presses and in-app Cancel buttons collapse state exactly the same way.
let navDepth = 0;
function computeNavDepth() {
  const fu = state.ui.food;
  if (state.tab === "food" && fu && (fu.scanningBarcode || fu.loggingRecipe || fu.recipeBuilder || fu.wizardType || fu.showAI || fu.manualEntry || fu.addingFood)) return 2;
  if (state.tab !== "dashboard") return 1;
  return 0;
}
function syncNavHistoryDepth() {
  const target = computeNavDepth();
  while (navDepth < target) { navDepth++; history.pushState({ macrologNav: navDepth }, ""); }
  if (target < navDepth) navDepth = target; // a "direct jump" (goToday, date nav, switching tabs) skips
  // stepBackOneLevel()'s history.back() -- just resync the counter rather than trying to pop
  // browser history to match; worst case a jump like this leaves a harmless extra entry that
  // costs one extra back-press before the app exits, far rarer than the normal step-by-step case.
}
// Collapses exactly one level based on current state -- shared by the popstate handler and by
// stepBackOneLevel()'s defensive fallback if navDepth somehow drifted out of sync.
function collapseOneNavLevel() {
  const fu = state.ui.food;
  if (state.tab === "food" && fu) {
    if (fu.scanningBarcode) { stopBarcodeCamera(); fu.scanningBarcode = false; fu.scanTarget = null; fu.scanError = null; fu.scanManualCode = ""; fu.scanLoading = false; fu.scanNotFoundCode = null; return true; }
    if (fu.loggingRecipe) { fu.loggingRecipe = null; return true; }
    if (fu.recipeBuilder) { fu.recipeBuilder = null; return true; }
    if (fu.wizardType) { fu.wizardType = null; fu.wizard = null; fu.wizardSuggestion = null; return true; }
    if (fu.showAI) {
      // Also reset aiDesc/aiPhoto (not just the results) -- otherwise a leftover description
      // or photo from a cancelled attempt would silently resurface (and clobber whatever the
      // search-box carryover would otherwise fill in) the next time the AI screen is opened.
      fu.showAI = false; fu.aiResults = null; fu.aiError = null; fu.aiCompareResults = null; fu.aiCompareError = null; fu.aiDesc = ""; fu.aiPhoto = null;
      return true;
    }
    if (fu.manualEntry) { fu.manualEntry = false; return true; }
    if (fu.addingFood) { fu.addingFood = null; return true; }
  }
  if (state.tab !== "dashboard") { stopBarcodeCamera(); state.tab = "dashboard"; state.ui = {}; return true; }
  return false;
}
// Call from a screen's own Cancel/Back/confirm action instead of clearing its flag directly,
// so browser-back and the in-app button always collapse state through the same single path.
// Guarded against rapid re-entry: history.back() is async (the actual collapse happens once
// its popstate arrives), so a fast double-tap on Cancel before that fires would otherwise
// queue a second history.back() and over-collapse by an extra level.
let backNavPending = false;
function stepBackOneLevel() {
  if (navDepth > 0) {
    if (backNavPending) return;
    backNavPending = true;
    history.back();
  } else {
    collapseOneNavLevel();
    rerender();
  }
}

function render() {
  syncNavHistoryDepth();
  root.innerHTML = renderApp();
  if (pendingFocusId) {
    const el = document.getElementById(pendingFocusId);
    if (el) { el.focus(); if (el.select) { try { el.select(); } catch(e){} } }
    pendingFocusId = null;
  }
  // A full innerHTML re-render tears down any live <video> element, which would otherwise
  // silently disconnect the camera feed if something re-renders while scanning is active.
  if (barcodeStream && state.ui.food && state.ui.food.scanningBarcode) {
    const v = document.getElementById("barcodeVideo");
    if (v) v.srcObject = barcodeStream;
  }
}

function rerender() { render(); }

// Delegated click handling: any element with data-action gets routed here.
root.addEventListener("click", function(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  const arg = el.getAttribute("data-arg");
  const arg2 = el.getAttribute("data-arg2");
  if (typeof actions[action] === "function") {
    actions[action](arg, arg2, el);
  }
});

// Delegated input handling for text/number inputs bound via data-bind
root.addEventListener("input", function(e) {
  const el = e.target;
  const bind = el.getAttribute && el.getAttribute("data-bind");
  if (bind && typeof inputActions[bind] === "function") {
    inputActions[bind](el.value, el);
  }
});

root.addEventListener("change", function(e) {
  const el = e.target;
  const bind = el.getAttribute && el.getAttribute("data-change");
  if (bind && typeof changeActions[bind] === "function") {
    changeActions[bind](el, e);
  }
});

// Enter key on any input tagged with data-enter triggers the same action as that
// screen's primary "confirm" button (search, log, save, add, etc.).
root.addEventListener("keydown", function(e) {
  if (e.key !== "Enter") return;
  const el = e.target;
  if (!el || el.tagName !== "INPUT") return;
  const actionName = el.getAttribute("data-enter");
  if (actionName && typeof actions[actionName] === "function") {
    e.preventDefault();
    el.blur();
    actions[actionName]();
  }
});

// Horizontal swipe on the weight chart pans its visible window (Colin's "scroll left and
// right on the chart"). Delegated on the root like everything else, keyed off a [data-panzone]
// wrapper so a re-render can't orphan the listeners. Passive and commit-on-touchend: live
// per-frame panning would mean a full innerHTML re-render per touchmove, and passive listeners
// leave normal vertical page scrolling completely alone -- a mostly-vertical gesture is
// ignored here and handled by the browser as the scroll it was.
let chartTouchStart = null;
let chartPanClickGuard = 0; // see actions.selectWeightPoint
root.addEventListener("touchstart", function(e) {
  const zone = e.target.closest && e.target.closest("[data-panzone]");
  if (!zone || e.touches.length !== 1) { chartTouchStart = null; return; }
  chartTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, width: zone.clientWidth || 300 };
}, { passive: true });
root.addEventListener("touchend", function(e) {
  const start = chartTouchStart;
  chartTouchStart = null;
  if (!start || !e.changedTouches || !e.changedTouches[0]) return;
  const dx = e.changedTouches[0].clientX - start.x;
  const dy = e.changedTouches[0].clientY - start.y;
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // a tap or a vertical scroll, not a pan
  const wu = weightUi();
  const days = weightRangeDays(wu.timeRange, wu.manualDays);
  if (!days) return; // "all" has nothing to pan
  // Dragging the chart right slides the window back in time by the same fraction of the
  // window the finger covered -- the plot moves with the finger, like panning a map.
  const shift = Math.round(days * (dx / start.width));
  if (shift === 0) return;
  chartPanClickGuard = Date.now() + 400;
  wu.panOffsetDays = Math.max(0, (wu.panOffsetDays || 0) + shift);
  rerender();
}, { passive: true });

// The logomark: a broken progress ring (the dashboard's core visual) in a cyan->blue->violet

function logoSvg(size) {

function btn(opts) {

// ============================================================
// APP SHELL
// ============================================================
// localStorage is the source of truth -- if a write fails, whatever was just logged is gone on
// reload. That has to be visible immediately and everywhere, not left as a console.error on a
// device with no console, and not tucked inside a settings tab the user has no reason to open.

    'This is usually a full storage quota — try Strategy &gt; Data &gt; Export to back up, then clear some space.' +

}

// ============================================================
// DATA HELPERS
// ============================================================
// No food database (USDA, Open Food Facts) reports protein "by source" -- this is a best-effort
// guess from the food's name, not real nutrition data. Meat, dairy, egg, and fish/seafood
// keywords all count as animal protein (eggs and fish aren't literally meat or dairy, but
// Colin confirmed they should count the same way, making the complement effectively "plant
// protein"). Word-boundary matching (\b) specifically to avoid false positives like "egg"
// matching inside "eggplant" or "ham" matching inside "hamster"/"shame". A handful of solid
// compound words (milkshake, cheeseburger, eggnog) are listed explicitly since \b wouldn't
// otherwise catch them (no boundary between "milk" and "shake" in "milkshake").
// Mixed dishes (e.g. "Chicken and Black Bean Burrito") are attributed entirely to animal
// protein if ANY animal keyword matches -- meaning the plant-protein total is a floor, not
// exact, and skews low on mixed dishes rather than high.
const ANIMAL_PROTEIN_RE = new RegExp(
  "\\b(chicken|turkey|beef|steak|pork|ham|bacon|sausage|lamb|veal|duck|meat|jerky|salami|" +
  "pepperoni|prosciutto|chorizo|brisket|ribs|meatball|ground beef|mince|" +
  "fish|salmon|tuna|shrimp|prawn|crab|lobster|cod|tilapia|sardine|anchovy|trout|halibut|" +
  "mahi|scallop|oyster|mussel|clam|seafood|calamari|squid|" +
  "milk|cheese|yogurt|yoghurt|cream|butter|ghee|whey|casein|kefir|mozzarella|cheddar|" +
  "parmesan|ricotta|custard|" +
  "egg|eggs|omelet|omelette|frittata|" +
  "milkshake|cheeseburger|hamburger|eggnog|buttermilk)\\b", "i"
);
function isAnimalProteinFood(name) {
  return ANIMAL_PROTEIN_RE.test(name || "");
}

// The saved plant/animal call for a food, or null if it's never been corrected. Read from
// foodCache first because that's an id-keyed dict (O(1), and this runs per entry on every
// getDayTotals, i.e. every render) and pruneFoodCache guarantees anything a logged entry still
// references stays in it. recentFoods is the fallback for a record that predates the cache --
// a restored v1.0 export has no foodCache at all.
function animalOverrideForFood(foodId) {
  if (!foodId) return null;
  const cached = state.foodCache[foodId];
  if (cached && cached.animalOverride != null) return cached.animalOverride;
  const rec = state.recentFoods.find(function(f){ return f.id === foodId; });
  if (rec && rec.animalOverride != null) return rec.animalOverride;
  return null;
}

// Three tiers, most specific first: a call made on THIS entry, then the call saved on the food
// record itself, then the keyword guess.
//
// The middle tier is what makes "set it once and it sticks" actually stick. Correcting the
// protein source used to be per-entry only, so re-adding the same food from History re-guessed
// from scratch and the correction had to be redone every single time. saveEntryDetails now
// writes the call back to the food record, which covers future logs via addFoodToLog -- and
// this lookup covers the ones ALREADY logged, since they carry animalOverride:null and so fall
// through to the record's answer. That's a live re-read, not a data migration: exactly how the
// keyword guess itself already applied retroactively to old entries.
function isAnimalProteinEntry(entry) {
  if (entry.animalOverride != null) return entry.animalOverride;
  const saved = animalOverrideForFood(entry.foodId);
  if (saved != null) return saved;
  return isAnimalProteinFood(entry.name);
}

function getDayTotals(date) {
  const entries = state.foodLogs[date] || [];
  return entries.reduce(function(acc, e) {
    const protein = e.macros.protein || 0;
    return {
      calories: acc.calories + (e.macros.calories || 0),
      protein: acc.protein + protein,
      carbs: acc.carbs + (e.macros.carbs || 0),
      fat: acc.fat + (e.macros.fat || 0),
      fiber: acc.fiber + (e.macros.fiber || 0),
      plantProtein: acc.plantProtein + (isAnimalProteinEntry(e) ? 0 : protein),
    };
  }, { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, plantProtein: 0 });
}

// ---- Per-day macro boosts (heavy-activity days) ----
// A boost adds grams of protein/carbs/fat on top of the base Strategy-tab targets for ONE
// specific date; the calorie target rises by the Atwater value of those grams automatically.
// Base targets in settings are untouched -- viewing any other day shows the normal numbers,
// and a boost set on a past date keeps applying when reviewing that day.
function dayBoostFor(date) {
  const b = state.dayBoosts[date];
  if (!b) return null;
  // Negative values are legitimate: a boost can REMOVE calories from a day (rest days, or
  // planning a lighter tomorrow), so this must not clamp at zero on read.
  const p = parseFloat(b.protein) || 0, c = parseFloat(b.carbs) || 0, f = parseFloat(b.fat) || 0;
  if (p === 0 && c === 0 && f === 0) return null; // all-zero = toggled off (kept as a tombstone for sync)
  return { protein: p, carbs: c, fat: f };
}

function boostCalories(boost) {
  if (!boost) return 0;
  return Math.round(boost.protein * 4 + boost.carbs * 4 + boost.fat * 9);
}

// ---- Target history: what were you aiming at on a given day? ----
// A calorie target is a point-in-time decision, not a permanent fact. Reading every past day
// against TODAY's target is a real distortion: switching from a cut to a bulk (1,876 -> 2,800)
// silently rewrote months of perfectly on-plan cut days into ~900 kcal-under-target failures,
// on every past dashboard and down the whole Last 7 Days log.
//
// Shape deliberately mirrors dayBoosts -- date-keyed, per-date newer-wins merge via
// foodRecordIsNewer, riding user_app_data under its own key (that column takes any string, so
// no schema migration). Keyed by DATE rather than appended so that typing "2800" into the
// calorie field, which fires an inputAction per keystroke, overwrites one entry for today
// instead of leaving "2", "28" and "280" behind as fake target changes.
function targetSnapshotOf(s) {
  return {
    calorieTarget: Math.max(0, s.calorieTarget || 0), proteinTarget: Math.max(0, s.proteinTarget || 0),
    carbsTarget: Math.max(0, s.carbsTarget || 0), fatTarget: Math.max(0, s.fatTarget || 0),
  };
}
function sameTargets(a, b) {
  return a.calorieTarget === b.calorieTarget && a.proteinTarget === b.proteinTarget &&
    a.carbsTarget === b.carbsTarget && a.fatTarget === b.fatTarget;
}
// The targets in effect on a given day: the most recent recorded change dated on or before it.
// With nothing recorded it falls back to current settings, which is exactly the pre-feature
// behaviour -- an install that has never changed a target behaves identically.
function targetsForDate(dateStr) {
  const hist = state.targetHistory || {};
  let best = null;    // newest change dated on or before the day
  let earliest = null; // oldest change on record, whatever its date
  Object.keys(hist).forEach(function(d) {
    if (d <= dateStr && (best === null || d > best)) best = d;
    if (earliest === null || d < earliest) earliest = d;
  });
  if (best !== null) return targetSnapshotOf(hist[best]);
  // Nothing recorded on or before this day. If anything is recorded at all, the oldest entry is
  // the best evidence available and is extended backwards -- falling through to CURRENT settings
  // here would reintroduce the exact bug for any day older than the first recorded change.
  // Only a genuinely empty history falls back to settings, which is the pre-feature behaviour.
  if (earliest !== null) return targetSnapshotOf(hist[earliest]);
  return targetSnapshotOf(state.settings);
}
// The last targets this device knows about. Null until boot establishes it, which is what
// stops a saveSettings() during startup from being mistaken for a user edit.
let lastKnownTargets = null;
function syncTargetBaseline() { lastKnownTargets = targetSnapshotOf(state.settings); }
function earliestLoggedDate() {
  let earliest = null;
  Object.keys(state.foodLogs).forEach(function(d) {
    if ((state.foodLogs[d] || []).length === 0) return;
    if (earliest === null || d < earliest) earliest = d;
  });
  return earliest;
}
function recordTargetChange() {
  if (lastKnownTargets === null) return false; // baseline not established yet (still booting)
  const now = targetSnapshotOf(state.settings);
  if (sameTargets(now, lastKnownTargets)) return false;
  const today = todayStr();
  // First ever change: write a baseline holding the OLD targets, dated back to the earliest day
  // there's a food log for. Without it every past day falls through to the NEW targets and
  // shows the exact distortion this exists to prevent. This is the one and only moment the old
  // value is still knowable -- after this write it's gone for good.
  if (Object.keys(state.targetHistory).length === 0) {
    const firstDay = earliestLoggedDate();
    if (firstDay && firstDay < today) {
      state.targetHistory[firstDay] = Object.assign({}, lastKnownTargets, { updatedAt: new Date().toISOString() });
    }
  }
  state.targetHistory[today] = Object.assign({}, now, { updatedAt: new Date().toISOString() });
  lastKnownTargets = now;
  saveTargetHistory();
  return true;
}

// The single place a day's EFFECTIVE targets come from. Everything that renders "X of Y"
// against a target must read this, not state.settings directly, or boosted days silently
// show the base numbers in some spots and boosted ones in others.
// The base is the target that was in effect on THAT day (targetsForDate), not today's.
function getDayTargets(date) {
  const s = targetsForDate(date);
  const boost = dayBoostFor(date);
  if (!boost) {
    return { calorieTarget: s.calorieTarget, proteinTarget: s.proteinTarget, carbsTarget: s.carbsTarget, fatTarget: s.fatTarget, boost: null };
  }
  // A large negative boost must not drive a target below zero -- a negative calorie or
  // macro goal is meaningless, and the progress-bar math divides by the target.
  return {
    calorieTarget: Math.max(0, s.calorieTarget + boostCalories(boost)),
    proteinTarget: Math.max(0, s.proteinTarget + boost.protein),
    carbsTarget: Math.max(0, s.carbsTarget + boost.carbs),
    fatTarget: Math.max(0, s.fatTarget + boost.fat),
    boost: boost,
  };
}

function writeDayBoost(date, protein, carbs, fat) {
  state.dayBoosts[date] = {
    protein: protein, carbs: carbs, fat: fat, // signed: negative = removing from that day
    // The stamp is what lets a toggle-off (all zeros) beat an older boost in the merge.
    updatedAt: new Date().toISOString(),
  };
  saveDayBoosts();
}

// "+320 kcal" / "−240 kcal" -- the chip and sublabels need the sign to be explicit, since a
// boost can now go either direction.
function signedKcal(kcal) {
  return (kcal >= 0 ? "+" : "−") + Math.abs(kcal);
}

// The past week's deficit/surplus, day by day, against the BASE calorie goal from the
// Strategy page -- deliberately not the boosted per-day target. The boost is a plan for the
// day; this log is the scoreboard against the standing goal, and measuring against a target
// that moves with each day's boost would let a boost hide the surplus it was meant to cover.
// Days with nothing logged are listed but flagged logged:false and EXCLUDED from the net --
// an unlogged day isn't a 1,900-kcal deficit, it's missing data, and counting it would make
// the weekly number look heroic after any lazy logging day.
// Calendar-day stepping via parseDateStr/setDate, never now()-N*86400000 (DST-unsafe).
function weeklyDeltaLog(endDateStr, days) {
  const out = [];
  const d = parseDateStr(endDateStr);
  d.setDate(d.getDate() - (days - 1));
  for (let i = 0; i < days; i++) {
    const dateStr = fmtDate(d);
    const entries = state.foodLogs[dateStr] || [];
    const calories = Math.round(entries.reduce(function(a, e){ return a + (e.macros.calories || 0); }, 0));
    // Each day is scored against the goal that was standing ON that day, not today's. Still
    // the BASE target for that day rather than getDayTargets' boosted one -- the boost is a
    // plan for the day, this log is the scoreboard against the standing goal.
    const target = targetsForDate(dateStr).calorieTarget || 0;
    out.push({
      date: dateStr,
      logged: entries.length > 0,
      calories: calories,
      target: target,
      delta: calories - target, // positive = surplus, negative = deficit
    });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function renderWeeklyDeltaCard() {
  const rows = weeklyDeltaLog(state.date, 7);
  const loggedRows = rows.filter(function(r){ return r.logged; });
  // The window can now straddle a target change, in which case there is no single number to
  // name here -- saying "vs 2,800" over days that were actually scored against 1,876 would
  // misdescribe the very column it labels.
  const spansOneTarget = rows.every(function(r){ return r.target === rows[0].target; });
  let inner = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">' +
    '<h3 class="cardTitle" style="margin:0">Last 7 Days</h3>' +
    '<span style="color:' + C.textMut + ';font-size:11px">' +
      (spansOneTarget ? 'vs ' + (rows[0] ? rows[0].target : 0).toLocaleString() + ' kcal goal' : "vs each day’s own goal") +
    '</span></div>';

  rows.forEach(function(r) {
    const isViewed = r.date === state.date;
    const deltaColor = !r.logged ? C.textMut : (r.delta <= 0 ? C.success : C.danger);
    inner += '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0' + (isViewed ? ';background:' + C.primary + '11;border-radius:6px;padding-left:6px;padding-right:6px;margin:0 -6px' : '') + '">' +
      '<span style="color:' + (isViewed ? C.text : C.textSec) + ';font-size:13px">' + esc(dayLabel(r.date)) + (r.date === todayStr() ? ' <span style="color:' + C.textMut + ';font-size:11px">today</span>' : '') + '</span>' +
      (r.logged
        ? '<span style="font-size:13px"><span style="color:' + C.textMut + '">' + r.calories.toLocaleString() + ' kcal</span>' +
          ' <span style="color:' + deltaColor + ';font-weight:700;display:inline-block;min-width:56px;text-align:right">' + signedKcal(r.delta) + '</span></span>'
        : '<span style="color:' + C.textMut + ';font-size:12px">no log</span>') +
    '</div>';
  });

  if (loggedRows.length > 0) {
    const net = loggedRows.reduce(function(a, r){ return a + r.delta; }, 0);
    inner += '<div style="display:flex;justify-content:space-between;border-top:1px solid ' + C.border + ';margin-top:8px;padding-top:10px">' +
      '<span style="color:' + C.textSec + ';font-size:13px;font-weight:600">Net (' + loggedRows.length + ' logged day' + (loggedRows.length === 1 ? '' : 's') + ')</span>' +
      '<span style="color:' + (net <= 0 ? C.success : C.danger) + ';font-size:14px;font-weight:800">' + signedKcal(net) + ' kcal</span></div>';
    inner += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:6px">' + (net <= 0 ? "Running a deficit" : "Running a surplus") + ' vs your goal. ~3,500 kcal ≈ 1 lb.</div>';
  } else {
    inner += '<div style="color:' + C.textMut + ';font-size:12px;text-align:center;padding:8px 0">Nothing logged this week yet.</div>';
  }
  return card(inner);
}

function addFoodToLog(food) {
  const entry = {
    id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    foodId: food.id, name: food.name, brand: food.brand || "",
    weight: food.loggedWeight || 100,
    macros: food.loggedMacros || { calories: food.calories, protein: food.protein, carbs: food.carbs, fat: food.fat, fiber: food.fiber || 0 },
    timestamp: food.timestamp || new Date().toISOString(),
    source: food.source || "Manual",
    animalOverride: food.animalOverride != null ? food.animalOverride : null,
    photo: food.photo || null,
    photoExpires: food.photo ? new Date(Date.now() + 2*24*60*60*1000).toISOString() : null,
    updatedAt: new Date().toISOString(),
  };
  if (!state.foodLogs[state.date]) state.foodLogs[state.date] = [];
  state.foodLogs[state.date].push(entry);
  saveFoodLogs();

  // stampedAt is written onto every copy of the food record below. It's what the whole-blob
  // merges resolve conflicts on (see foodRecordIsNewer) -- without it a record already present
  // on another device can never be updated by this one, only added.
  const stampedAt = new Date().toISOString();

  if (food.wizardUsed && !state.favorites.find(function(f){ return f.id === food.id; })) {
    state.favorites.unshift(Object.assign({}, food, { addedAt: stampedAt, updatedAt: stampedAt }));
    state.favorites = state.favorites.slice(0, 100);
    saveFavorites();
  }
  // History (the Food tab's History sub-tab) is meant to be a durable, searchable list of
  // everything ever added, so old items can be re-found and re-added -- so this cap is
  // deliberately high (was 50, which quietly dropped anything older). 500 distinct foods is
  // effectively "everything" for one person over years while keeping the synced JSON blob a
  // sane size; only the very oldest, least-recently-used items fall off past that.
  state.recentFoods = [Object.assign({}, food, { lastUsed: stampedAt, updatedAt: stampedAt })]
    .concat(state.recentFoods.filter(function(r){ return r.id !== food.id; }))
    .slice(0, 500);
  saveRecentFoods();

  if (!state.foodCache[food.id]) {
    state.foodCache[food.id] = Object.assign({}, food, { updatedAt: stampedAt });
    pruneFoodCache();
    saveFoodCache();
  }
  showToast("Food Added");
}

// state.foodCache is the only food collection with no cap -- recentFoods stops at 500 and
// favorites at 100, but every food ever searched-then-logged used to stay here forever, and
// the whole dictionary is re-uploaded as one JSON blob on every debounced sync. Left alone
// that becomes a steadily growing upload on every save and real pressure on the ~5MB
// localStorage budget, on the platform whose eviction behaviour already caused a data-loss bug.
//
// Deliberately a reachability sweep rather than an LRU: cache records carry no access time, so
// "least recently used" isn't knowable, but "referenced by something the user can still see"
// is exactly knowable. Anything a logged entry, History, Favorites or a custom barcode can
// still reach is kept regardless of the cap -- dropping one of those would break the portion
// re-derivation in rescaleEntryMacros. Only genuinely unreachable records are discarded, and
// only once the cache is over budget.
const FOOD_CACHE_CAP = 1500;
function pruneFoodCache() {
  const ids = Object.keys(state.foodCache);
  if (ids.length <= FOOD_CACHE_CAP) return 0;
  const referenced = new Set();
  state.recentFoods.forEach(function(f){ if (f && f.id) referenced.add(f.id); });
  state.favorites.forEach(function(f){ if (f && f.id) referenced.add(f.id); });
  Object.keys(state.customBarcodes).forEach(function(code) {
    const f = state.customBarcodes[code];
    if (f && f.id) referenced.add(f.id);
  });
  Object.keys(state.foodLogs).forEach(function(date) {
    (state.foodLogs[date] || []).forEach(function(e){ if (e && e.foodId) referenced.add(e.foodId); });
  });
  let dropped = 0;
  ids.forEach(function(id) {
    if (!referenced.has(id)) { delete state.foodCache[id]; dropped++; }
  });
  return dropped;
}

function removeFoodFromLog(entryId) {
  state.foodLogs[state.date] = (state.foodLogs[state.date] || []).filter(function(e){ return e.id !== entryId; });
  saveFoodLogs();
  scheduleCloudDelete("food_log_entries", "id", entryId);
}

function updateFoodEntry(entryId, updates) {
  state.foodLogs[state.date] = (state.foodLogs[state.date] || []).map(function(e) {
    return e.id === entryId ? Object.assign({}, e, updates, { updatedAt: new Date().toISOString() }) : e;
  });
  saveFoodLogs();
}

// DASHBOARD TAB
// ============================================================
function renderDashboard() {
  const totals = getDayTotals(state.date);
  const set = state.settings;
  // Effective targets for THIS day -- base settings plus any activity boost toggled on it.
  const t = getDayTargets(state.date);
  const calPct = t.calorieTarget > 0 ? Math.round((totals.calories / t.calorieTarget) * 100) : 0;
  const remaining = t.calorieTarget - totals.calories;
  const entries = state.foodLogs[state.date] || [];

  let html = card(
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">' +
      '<div>' +
        '<div style="font-size:42px;font-weight:800;line-height:1;letter-spacing:-1px">' + Math.round(totals.calories).toLocaleString() + '</div>' +
        '<div style="color:' + C.textMut + ';font-size:14px;margin-top:4px">of ' + t.calorieTarget.toLocaleString() + ' kcal' + (t.boost ? ' <span style="color:' + C.warning + '">⚡</span>' : '') + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
        '<div style="font-size:28px;font-weight:700;color:' + (remaining >= 0 ? C.success : C.danger) + '">' + Math.abs(Math.round(remaining)) + '</div>' +
        '<div style="color:' + C.textMut + ';font-size:12px;text-transform:uppercase">' + (remaining >= 0 ? "Remaining" : "Over") + '</div>' +
        '<div style="color:' + C.textMut + ';font-size:13px;margin-top:2px">' + calPct + '% done</div>' +
      '</div>' +
    '</div>' +
    progressBar(totals.calories, t.calorieTarget, C.calories, "Calories", t.boost ? "(" + signedKcal(boostCalories(t.boost)) + " boost)" : "", " kcal") +
    progressBar(totals.protein, t.proteinTarget, C.protein, "Protein", (set.showPlantProtein && totals.plantProtein > 0) ? "(" + Math.round(totals.plantProtein) + "g plant-based)" : "") +
    progressBar(totals.carbs, t.carbsTarget, C.carbs, "Carbs", totals.fiber > 0 ? "(" + Math.round(totals.fiber) + "g fiber)" : "") +
    progressBar(totals.fat, t.fatTarget, C.fat, "Fat") +
    renderDayBoostBlock(t.boost) +
    renderDashboardFeedBlock(state.date, t)
  );

  html += '<div class="row" style="margin-bottom:16px">' + btn({ label: "\uFF0B Add Food", action: "setTab", arg: "food", full: true }) + '</div>';

  if (entries.length > 0) {
    const groups = groupEntriesByHourNewestFirst(entries);
    let logHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
      '<h3 class="cardTitle" style="margin:0">Today\'s Log</h3>' +
      '<span style="color:' + C.textMut + ';font-size:13px">' + entries.length + ' items</span></div>';

    groups.forEach(function(group) {
      const gm = hourGroupMacros(group.items);
      // Bracketed plant share, on the same terms as the Protein progress bar above: only when
      // there is some, and only when the preference is on. "(0)" on an all-animal hour would
      // be noise on the row it's meant to annotate.
      const plantSuffix = (set.showPlantProtein && gm.plantProtein > 0) ? ' (' + Math.round(gm.plantProtein) + ')' : '';
      // flex-wrap on both the row and the label group: on a narrow phone the macros drop to
      // their own line rather than squeezing the hour or pushing the kcal off the edge.
      logHtml += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:12px 0 8px">' +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0">' +
          '<span style="color:' + C.textSec + ';font-size:13px;font-weight:600">\u{1F550} ' + group.label + '</span>' +
          '<span style="display:flex;gap:8px;font-size:11px">' +
            '<span style="color:' + C.protein + '">P: ' + Math.round(gm.protein) + 'g' + plantSuffix + '</span>' +
            '<span style="color:' + C.carbs + '">C: ' + Math.round(gm.carbs) + 'g</span>' +
            '<span style="color:' + C.fat + '">F: ' + Math.round(gm.fat) + 'g</span>' +
          '</span>' +
        '</div>' +
        '<span style="color:' + C.textMut + ';font-size:12px">' + Math.round(gm.calories) + ' kcal</span></div>';
      group.items.forEach(function(entry) {
        logHtml += renderFoodEntry(entry);
      });
    });
    html += card(logHtml);
  } else {
    html += card('<div class="empty"><div style="font-size:32px;margin-bottom:8px">\u{1F37D}</div><div style="color:' + C.textSec + ';font-size:15px">No food logged yet today</div><div style="color:' + C.textMut + ';font-size:13px;margin-top:4px">Tap "Add Food" to get started</div></div>');
  }

  html += renderWeeklyDeltaCard();

  return html;
}

// The per-day activity-boost control, rendered at the bottom of the dashboard's targets card.
// What the Fitness Dashboard measured for this day, shown under the targets card.
//
// SHADOW MODE, deliberately: this reports, it does not decide. getDayTargets() is untouched,
// so the big number at the top of the dashboard and every progress bar still come from
// MacroLog's own targets plus its own ⚡ boost. The dashboard's recommendation sits beside
// them as a second opinion, and acting on it is a manual ⚡ tap. Wiring it straight into the
// day's target would mean a number Colin never chose moving his calorie goal every time a
// watch sync landed -- worth doing eventually, but as its own decision with its own switch,
// not as a side effect of being able to read the feed.
//
// Renders nothing at all when the day has no published row (before the dashboard's first
// publish, or a day outside its trailing window) -- an empty framed block reads as broken.
function renderDashboardFeedBlock(dateStr, dayTargets) {
  const feed = dashboardFeedFor(dateStr);
  if (!feed) return "";

  const diff = feed.recommended - (dayTargets ? dayTargets.calorieTarget : 0);
  let html = '<div style="border-top:1px solid ' + C.border + ';margin-top:14px;padding-top:12px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
      '<span style="color:' + C.textSec + ';font-size:12px;font-weight:600">🏃 Fitness Dashboard</span>' +
      '<span style="color:' + C.text + ';font-size:15px;font-weight:700">' + feed.recommended.toLocaleString() + ' kcal</span>' +
    '</div>';

  // The burn is the whole point of the integration, so it is named even when it's zero --
  // "no training logged" is a real answer, and its absence would read as missing data.
  const burnLine = feed.burn > 0
    ? (feed.burn.toLocaleString() + ' kcal from activity' + (feed.burnCounted ? '' : ' (not counted in its total)'))
    : 'No activity burn logged for this day';
  html += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:4px">' + esc(burnLine) + '</div>';

  if (feed.tdee) {
    const band = (feed.tdeeLow && feed.tdeeHigh)
      ? ' (' + feed.tdeeLow.toLocaleString() + '–' + feed.tdeeHigh.toLocaleString() + ')'
      : '';
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:2px">Measured maintenance ' +
      feed.tdee.toLocaleString() + band + ' kcal/day</div>';
  }

  // Only worth printing when the two disagree by enough to act on. Below that the difference
  // is rounding and boost arithmetic, and a "+3 kcal" nudge is noise dressed as a finding.
  if (Math.abs(diff) >= 25) {
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:4px">' +
      signedKcal(diff) + ' kcal vs your target here — tap ⚡ above to apply it to this day.</div>';
  }

  html += '</div>';
  return html;
}

// Toggling and stepping are all BUTTONS (no text inputs), so plain rerender() per tap is safe
// -- the no-rerender-on-keystroke rule only bites on typed fields.
// Steps are +10g protein / +10g carbs / +5g fat per tap: comparable calorie increments
// (40/40/45 kcal), coarse enough to dial in a few hundred extra kcal in a handful of taps.
function renderDayBoostBlock(activeBoost) {
  const open = !!state.ui.dayBoostOpen;
  let html = '<div style="border-top:1px solid ' + C.border + ';margin-top:14px;padding-top:12px">';

  const label = activeBoost
    ? "⚡ Activity boost: " + signedKcal(boostCalories(activeBoost)) + " kcal"
    : "⚡ Activity boost";
  html += '<button class="chip' + (activeBoost ? " active" : "") + '" data-action="toggleDayBoostPanel" style="width:100%;text-align:center">' +
    label + (open ? " ▴" : " ▾") + '</button>';

  if (open) {
    const b = activeBoost || { protein: 0, carbs: 0, fat: 0 };
    const stepperRow = function(name, key, color, step) {
      const v = b[key];
      return '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">' +
        '<span style="color:' + color + ';font-size:14px;font-weight:600;min-width:64px">' + name + '</span>' +
        '<div style="display:flex;align-items:center;gap:12px">' +
          '<button class="chip" data-action="bumpDayBoost" data-arg="' + key + '" data-arg2="-' + step + '" style="min-width:44px;font-size:16px">−</button>' +
          '<span style="color:' + (v < 0 ? C.danger : C.text) + ';font-size:15px;font-weight:700;min-width:52px;text-align:center">' + (v >= 0 ? "+" : "−") + Math.abs(v) + 'g</span>' +
          '<button class="chip" data-action="bumpDayBoost" data-arg="' + key + '" data-arg2="' + step + '" style="min-width:44px;font-size:16px">＋</button>' +
        '</div>' +
      '</div>';
    };
    html += stepperRow("Protein", "protein", C.protein, 10) +
      stepperRow("Carbs", "carbs", C.carbs, 10) +
      stepperRow("Fat", "fat", C.fat, 5);
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:10px">Adjusts this day’s targets only — up for heavy activity, down to bank a deficit. Your base targets in Strategy stay unchanged. Applies just to ' + esc(state.date === todayStr() ? "today" : dayLabel(state.date)) + '.</div>';
    if (activeBoost) {
      html += '<div style="margin-top:10px">' + btn({ label: "Clear boost", action: "clearDayBoost", small: true, outline: true, full: true }) + '</div>';
    }
  }
  html += '</div>';
  return html;
}

actions.toggleDayBoostPanel = function() { state.ui.dayBoostOpen = !state.ui.dayBoostOpen; rerender(); };
actions.bumpDayBoost = function(macro, deltaStr) {
  if (macro !== "protein" && macro !== "carbs" && macro !== "fat") return;
  const delta = parseFloat(deltaStr) || 0;
  const current = dayBoostFor(state.date) || { protein: 0, carbs: 0, fat: 0 };
  const next = Object.assign({}, current);
  // Signed, but floored so the day's EFFECTIVE target can't go below zero -- stepping further
  // down than the base target would just bank taps the user has to undo one by one later.
  const baseKey = macro + "Target";
  next[macro] = Math.max(-(state.settings[baseKey] || 0), next[macro] + delta);
  writeDayBoost(state.date, next.protein, next.carbs, next.fat);
  rerender();
};
actions.clearDayBoost = function() {
  // Written as all-zeros rather than deleted: the zero entry's fresh updatedAt is what lets
  // "toggled off" win the newer-wins merge against an older non-zero copy on another device.
  writeDayBoost(state.date, 0, 0, 0);
  state.ui.dayBoostOpen = false;
  rerender();
};

// Buckets a day's entries into hour groups, newest first both BETWEEN groups (5 PM above 2 PM)
// and WITHIN each group (the food just logged sits at the top of its hour, not the bottom).
// Sorted on the real timestamp rather than relying on array order: entries are appended in the
// order they're created, so a food moved or copied in from another day lands at the end of the
// array carrying an older time, and order-of-insertion put it in the wrong place.
// Keyed by the numeric hour, not the display label, so the ordering can't depend on how "12 AM"
// happens to sort as a string. Entries with an unparseable timestamp are bucketed under hour 0
// rather than an "NaN AM" heading.
function groupEntriesByHourNewestFirst(entries) {
  const byHour = new Map();
  (entries || []).forEach(function(e, i) {
    const d = new Date(e.timestamp);
    const t = d.getTime();
    const valid = !isNaN(t);
    const h = valid ? d.getHours() : 0;
    if (!byHour.has(h)) byHour.set(h, []);
    byHour.get(h).push({ entry: e, t: valid ? t : 0, i: i });
  });
  return [...byHour.keys()].sort(function(a, b){ return b - a; }).map(function(h) {
    // `i` breaks ties: timestamps only carry ms, and two foods logged in the same instant
    // would otherwise keep their insertion order (oldest first) via sort stability -- the exact
    // opposite of what this function is for. Later insertion wins.
    const items = byHour.get(h)
      .sort(function(a, b){ return (b.t - a.t) || (b.i - a.i); })
      .map(function(x){ return x.entry; });
    return { hour: h, label: (h === 0 ? 12 : h > 12 ? h - 12 : h) + " " + (h >= 12 ? "PM" : "AM"), items: items };
  });
}

// Macro rollup for one hour group's heading on the dashboard log.
//
// Plant protein comes from isAnimalProteinEntry, NOT the raw isAnimalProteinFood keyword test
// -- the same three-tier resolution getDayTotals uses (this entry's own call, then the food
// record's saved call, then the keyword guess). Anything else and an hour row could contradict
// the Protein bar directly above it about the same food, and the hour rows would stop summing
// to the day.
//
// Pure and state-only (it reads nothing but the entries handed to it, plus the same food
// records getDayTotals reads), so it's unit-tested directly.
function hourGroupMacros(items) {
  return (items || []).reduce(function(acc, e) {
    const m = e.macros || {};
    const protein = m.protein || 0;
    return {
      calories: acc.calories + (m.calories || 0),
      protein: acc.protein + protein,
      carbs: acc.carbs + (m.carbs || 0),
      fat: acc.fat + (m.fat || 0),
      plantProtein: acc.plantProtein + (isAnimalProteinEntry(e) ? 0 : protein),
    };
  }, { calories: 0, protein: 0, carbs: 0, fat: 0, plantProtein: 0 });
}

// ---- Editing the time of day an entry was eaten ----
// The dashboard's log groups are derived from entry.timestamp by groupEntriesByHourNewestFirst,
// never from a fixed list of hours -- so simply setting a new time is also what moves an entry
// into an hour that has nothing logged in it yet. That hour's group appears on its own.
const ENTRY_TIME_PRESETS = [
  ["Breakfast", "08:00"], ["Lunch", "12:30"], ["Snack", "15:30"], ["Dinner", "18:30"],
];
// Value for <input type="time">, which wants 24-hour "HH:MM" regardless of how the phone
// displays it. Local hours/minutes, not the ISO string's UTC ones.
function entryTimeInputValue(entry) {
  const d = new Date(entry && entry.timestamp);
  if (isNaN(d.getTime())) return "";
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function entryTimeLabel(entry) {
  const d = new Date(entry && entry.timestamp);
  if (isNaN(d.getTime())) return "an unknown time";
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}
// Combines the entry's own log DATE with a chosen wall-clock time. Built through the local-time
// Date constructor rather than by splicing hours into the existing ISO string: an ISO string is
// UTC, so string surgery would shift the entry by the timezone offset (and by another hour
// across a DST boundary) -- the same trap fmtDate and weightChartCutoff already exist to avoid.
// Returns null rather than a bad stamp on unparseable input; seconds are zeroed so a time set by
// hand sorts predictably against one captured at log time.
function entryTimestampForTime(dateStr, hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm == null ? "" : hhmm).trim());
  if (!m) return null;
  const hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (!(hh >= 0 && hh <= 23) || !(mm >= 0 && mm <= 59)) return null;
  const d = parseDateStr(String(dateStr || ""));
  if (isNaN(d.getTime())) return null;
  d.setHours(hh, mm, 0, 0);
  return d.toISOString();
}

// A real, distinct brand is shown as its own line; falling back to the source (e.g. "Manual
// Entry", "Recipe") would just repeat the source line right underneath it, so that fallback is
// suppressed here (unlike foodQuantityLabel, which needs a fallback for the math to be right --
// this one is purely cosmetic).
function entryBrandLine(entry) {
  return (entry.brand && entry.brand !== entry.source) ? entry.brand : null;
}

// True protein/carbs/fat all recorded as exactly zero -- almost always a sign something went
// wrong capturing the macros (a bad AI estimate, a product with missing OFF nutrition data,
// etc.) rather than a food that's genuinely all zeros, so it's worth flagging rather than
// silently trusting it. Deliberately does not check calories -- a food can have real calories
// from something not tracked (e.g. alcohol) while still validly having 0g of all three.
function entryHasZeroMacros(entry) {
  const m = entry.macros;
  return m.protein === 0 && m.carbs === 0 && m.fat === 0;
}

function renderFoodEntry(entry) {
  const editing = state.ui.editingEntryId === entry.id;
  const confirmingRemove = state.ui.confirmRemoveEntryId === entry.id;
  const brandLine = entryBrandLine(entry);
  const zeroMacros = entryHasZeroMacros(entry);
  let html = '<div class="foodEntry">' +
    '<div data-action="toggleEntryEditor" data-arg="' + entry.id + '" style="cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div style="flex:1;min-width:0">' +
        '<div style="color:' + C.text + ';font-weight:600;font-size:14px">' + esc(entry.name) + '</div>' +
        (brandLine ? '<div style="color:' + C.textMut + ';font-size:12px;margin-top:1px">' + esc(brandLine) + '</div>' : '') +
        '<div style="color:' + C.textMut + ';font-size:12px;margin-top:2px">' + esc(entry.source) + ' \u2022 ' + entry.weight + 'g</div>' +
        (zeroMacros ? '<div style="color:' + C.warning + ';font-size:11px;margin-top:4px">\u26a0 No protein/carbs/fat recorded \u2014 tap to check the macros</div>' : '') +
      '</div>' +
      '<div style="text-align:right;display:flex;align-items:center;gap:8px">' +
        '<span style="color:' + C.calories + ';font-weight:700;font-size:16px">' + entry.macros.calories + '</span>' +
        '<span style="color:' + C.textMut + ';font-size:12px">kcal</span>' +
        '<button data-action="askRemoveFood" data-arg="' + entry.id + '" style="background:none;border:none;color:' + C.textMut + ';cursor:pointer;font-size:16px;padding:2px">\u{1F5D1}</button>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-top:8px;font-size:12px">' +
      '<span style="color:' + C.protein + '">P: ' + entry.macros.protein + 'g</span>' +
      '<span style="color:' + C.carbs + '">C: ' + entry.macros.carbs + 'g</span>' +
      '<span style="color:' + C.fat + '">F: ' + entry.macros.fat + 'g</span>' +
    '</div>';

  if (confirmingRemove) {
    html += '<div class="row" style="margin-top:8px">' +
      btn({ label: "Cancel", action: "cancelRemoveFood", small: true, outline: true, full: true }) +
      btn({ label: "Remove Entry?", action: "removeFood", arg: entry.id, small: true, full: true, color: "danger" }) +
    '</div>';
  }
  if (editing) html += renderEntryEditor(entry);
  html += '</div>';
  return html;
}

function renderEntryEditor(entry) {
  const section = state.ui.entrySection || "portion";
  let html = '<div style="margin-top:10px;padding:10px;background:' + C.bg + ';border-radius:10px">' +
    '<div class="row" style="margin-bottom:10px;flex-wrap:wrap">' +
      '<button class="sectionBtn' + (section === "portion" ? " active" : "") + '" data-action="setEntrySection" data-arg="portion">Portion</button>' +
      '<button class="sectionBtn' + (section === "macros" ? " active" : "") + '" data-action="setEntrySection" data-arg="macros">Macros</button>' +
      '<button class="sectionBtn' + (section === "details" ? " active" : "") + '" data-action="setEntrySection" data-arg="details">Details</button>' +
      '<button class="sectionBtn' + (section === "time" ? " active" : "") + '" data-action="setEntrySection" data-arg="time">Time</button>' +
      '<button class="sectionBtn' + (section === "move" ? " active" : "") + '" data-action="setEntrySection" data-arg="move">Move Day</button>' +
      '<button class="sectionBtn' + (section === "copy" ? " active" : "") + '" data-action="setEntrySection" data-arg="copy">Copy</button>' +
    '</div>';

  if (section === "portion") {
    const cachedFood = state.foodCache[entry.foodId];
    const weightVal = state.ui.entryWeightInput != null ? state.ui.entryWeightInput : String(entry.weight);
    const sizes = (cachedFood && cachedFood.servingSizes) || [];
    if (sizes.length > 0) {
      html += '<div class="rowWrap" style="margin-bottom:10px">' +
        sizes.map(function(s) {
          return '<button class="chip' + (parseFloat(weightVal) === s.grams ? ' active' : '') + '" data-action="setEntryWeight" data-arg="' + s.grams + '">' + esc(s.label) + '</button>';
        }).join('') +
      '</div>';
    }
    html += '<div class="row" style="align-items:center;margin-bottom:8px">' +
      textInput({ id: "entryWeightInput", value: weightVal, type: "number", bind: "entryWeightInput", enter: "saveEntryPortion", style: "flex:1" }) +
      '<span style="color:' + C.textMut + ';font-size:12px">g</span>' +
      btn({ label: "Save", action: "saveEntryPortion", small: true }) +
    '</div>';
    // Preview goes through the same rescaleEntryMacros the Save action uses, so what's shown is
    // exactly what gets stored -- it used to preview calcMacrosForWeight(cachedFood, w) while
    // Save could take the proportional path, and the two disagree for a hand-corrected entry.
    html += '<div id="entryPortionPreview" style="color:' + C.textMut + ';font-size:11px">' +
      entryPortionPreviewText(entry, parseFloat(weightVal) || 0) + '</div>';
  } else if (section === "macros") {
    const m = entry.macros;
    const isCustom = entry.source === "Recipe" || entry.source === "Manual Entry" || entry.source === "Custom Barcode Entry";
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
      '<div><label class="label" style="color:' + C.calories + '">Calories (kcal)</label>' +
        '<input class="input" type="number" id="editMacroCaloriesInput" value="' + m.calories + '" data-enter="saveEditMacros" style="padding:6px;font-size:13px"></div>' +
      macroEditField("protein", "Protein (g)", m.protein, "saveEditMacros", "editMacroProtein") +
      macroEditField("carbs", "Carbs (g)", m.carbs, "saveEditMacros", "editMacroCarbs") +
      macroEditField("fat", "Fat (g)", m.fat, "saveEditMacros", "editMacroFat") +
      macroEditField("fiber", "Fiber (g)", m.fiber || 0) +
    '</div>';
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:8px">Calories auto-calculate from protein/carbs/fat \u2014 edit it directly to override (e.g. alcohol, which adds calories beyond P/C/F).</div>';
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:8px">' +
      (isCustom ? "This is a " + (entry.source === "Recipe" ? "recipe" : "custom food") + " you created \u2014 saving here also updates it for next time." : "This only changes today\u2019s entry \u2014 the original food won\u2019t be affected.") +
    '</div>';
    html += btn({ label: "Save Macros", action: "saveEditMacros", small: true });
  } else if (section === "details") {
    const nameVal = state.ui.entryNameInput != null ? state.ui.entryNameInput : entry.name;
    const brandVal = state.ui.entryBrandInput != null ? state.ui.entryBrandInput : (entry.brand || "");
    // Falls back to the food record's saved call, not raw entry.animalOverride: an entry logged
    // before the correction still carries null, and showing "Auto" for a food that is in fact
    // saved as Animal would misreport what the dashboard is actually counting.
    const savedOverride = entry.animalOverride != null ? entry.animalOverride : animalOverrideForFood(entry.foodId);
    const override = state.ui.entryAnimalOverrideInput !== undefined ? state.ui.entryAnimalOverrideInput : savedOverride;
    html += '<div style="margin-bottom:10px"><label class="label">Food Name</label>' +
      textInput({ id: "entryNameInput", value: nameVal, bind: "entryNameInput", enter: "saveEntryDetails" }) + '</div>';
    html += '<div style="margin-bottom:10px"><label class="label">Brand</label>' +
      textInput({ id: "entryBrandInput", value: brandVal, placeholder: "e.g. Schneiders", bind: "entryBrandInput", enter: "saveEntryDetails" }) + '</div>';
    html += '<div style="margin-bottom:10px"><label class="label" style="margin-bottom:6px">Protein Source</label><div class="row">' +
      [[null,"Auto"],[false,"Plant"],[true,"Animal"]].map(function(o) {
        const active = override === o[0];
        return '<button class="chip' + (active ? ' active' : '') + '" data-action="setEntryAnimalOverride" data-arg="' + (o[0] === null ? "auto" : o[0]) + '" style="flex:1;text-align:center">' + o[1] + '</button>';
      }).join('') +
    '</div></div>';
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:8px">"Auto" guesses from the food name for the dashboard’s plant-protein estimate. Override it here if it guessed wrong — the choice is saved against this food, so every past and future serving of it uses the same answer.</div>';
    html += btn({ label: "Save Details", action: "saveEntryDetails", small: true });
  } else if (section === "time") {
    const timeVal = state.ui.entryTimeInput != null ? state.ui.entryTimeInput : entryTimeInputValue(entry);
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:10px">Logged at <span style="color:' + C.textSec + '">' + esc(entryTimeLabel(entry)) + '</span>. Pick any time of day \u2014 the log groups by hour, so an hour with nothing in it yet simply appears.</div>';
    // Presets fill the field rather than saving outright (unlike Move Day's Yesterday/Today,
    // which are exact): "Breakfast" is a rough 8:00 guess most people will want to nudge, so
    // this mirrors the Portion tab's serving chips -- chip sets the value, Save commits it.
    html += '<div class="rowWrap" style="margin-bottom:10px">' +
      ENTRY_TIME_PRESETS.map(function(p) {
        return '<button class="chip' + (timeVal === p[1] ? ' active' : '') + '" data-action="setEntryTimePreset" data-arg="' + p[1] + '">' + esc(p[0]) + '</button>';
      }).join('') +
      '<button class="chip" data-action="setEntryTimeNow">Now</button>' +
    '</div>';
    html += '<div class="row" style="align-items:center">' +
      textInput({ id: "entryTimeInput", value: timeVal, type: "time", bind: "entryTimeInput", enter: "saveEntryTime", style: "flex:1" }) +
      btn({ label: "Save Time", action: "saveEntryTime", small: true }) +
    '</div>';
  } else if (section === "move") {
    const targetDate = state.ui.entryMoveDate || state.date;
    html += '<div class="row" style="margin-bottom:10px">' +
      btn({ label: "\u2039 Yesterday", action: "moveEntryYesterday", small: true, outline: true }) +
      btn({ label: "Today", action: "moveEntryToday", small: true, outline: true }) +
      btn({ label: "Tomorrow \u203a", action: "moveEntryTomorrow", small: true, outline: true }) +
    '</div>';
    html += '<div class="row" style="align-items:center">' +
      textInput({ value: targetDate, type: "date", bind: "entryMoveDate", style: "flex:1" }) +
      btn({ label: "Move", action: "moveEntryCustomDate", small: true }) +
    '</div>';
  } else {
    const copyDate = state.ui.entryCopyDate || state.date;
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:10px">Logs a duplicate of this entry on the date you pick \u2014 the original stays right here.</div>';
    html += '<div class="row" style="margin-bottom:10px">' +
      btn({ label: "\u2039 Yesterday", action: "copyEntryYesterday", small: true, outline: true }) +
      btn({ label: "Today", action: "copyEntryToday", small: true, outline: true }) +
      btn({ label: "Tomorrow \u203a", action: "copyEntryTomorrow", small: true, outline: true }) +
    '</div>';
    html += '<div class="row" style="align-items:center">' +
      textInput({ value: copyDate, type: "date", bind: "entryCopyDate", style: "flex:1" }) +
      btn({ label: "Copy", action: "copyEntryCustomDate", small: true }) +
    '</div>';
  }
  // For barcode-scanned items only: after fixing the weight (Portion) and/or macros (Macros)
  // above, offer to remember the correction so the NEXT scan of this barcode uses it instead
  // of the wrong data the scan returned. Shown on the Portion/Macros tabs, where the fixing
  // actually happens.
  if ((section === "portion" || section === "macros") && barcodeCodeForEntry(entry)) {
    html += '<div style="border-top:1px solid ' + C.border + ';margin-top:12px;padding-top:12px">' +
      '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:8px">Scanned by barcode. Fixed the numbers above? Save the correction so future scans of this product use it.</div>' +
      btn({ label: "\u{1F4BE} Save correction for future scans", action: "saveBarcodeCorrection", arg: entry.id, small: true, outline: true }) +
    '</div>';
  }
  html += '</div>';
  return html;
}

// edited -- shared by the dashboard log-entry Macros tab and the History food-record Macros

// Atwater calories). Fixes a real gap: alcohol contributes ~7 kcal/g that isn't captured by
// protein/carbs/fat at all, so a food containing it needs calories to be a real, editable
// number rather than always silently re-derived from P/C/F -- exactly like Manual Entry's

// Tolerances for entryMatchesFood, sized to calcMacrosForWeight's own rounding rather than
// picked by feel: calories go through Math.round (max 0.5 divergence between two roundings of
// the same value) and macros through round1 (max 0.05). Anything outside these is a real
// difference, not a rounding artefact -- so they're tight enough that a genuine hand
// correction is never mistaken for noise, and loose enough that an untouched entry never
// reads as edited.
const MATCH_TOLERANCE_KCAL = 1;
const MATCH_TOLERANCE_GRAMS = 0.15;
const MACRO_KEYS_FOR_MATCH = ["calories", "protein", "carbs", "fat", "fiber"];

// True when `entry`'s macros are still exactly what `food` predicts at the entry's own weight,
// i.e. nobody has hand-corrected this entry away from its source food. Compared against a
// re-derivation rather than a stored flag so it also holds for entries logged before any of
// this existed. Tolerance absorbs the rounding calcMacrosForWeight applies (calories to a whole
// number, macros to 1dp) -- an exact === would report a false mismatch on ordinary entries.
function entryMatchesFood(entry, food) {
  if (!food || !entry || !entry.macros) return false;
  const w = positiveGramsOr(entry.weight, 0);
  if (w <= 0) return false;
  const m = calcMacrosForWeight(food, w);
  // Fiber is checked too, not just P/C/F: it's one of the four editable fields on the Macros
  // tab, and leaving it out would classify a fiber-only correction as "unmodified" and then
  // discard it on the next portion change -- the exact failure this function exists to prevent.
  return MACRO_KEYS_FOR_MATCH.every(function(k) {
    const tol = k === "calories" ? MATCH_TOLERANCE_KCAL : MATCH_TOLERANCE_GRAMS;
    return Math.abs((m[k] || 0) - (entry.macros[k] || 0)) <= tol;
  });
}

// Macros for `entry` at a new weight. Re-deriving from the source food is preferred (it scales
// from the food's own base rather than from already-rounded per-entry numbers, so repeated
// portion edits don't accumulate drift) -- but ONLY when the entry still agrees with that food.
// If the entry's macros were hand-corrected on the Macros tab, the editor promised "this only
// changes today's entry"; re-deriving from the food would silently throw that correction away
// on the next portion change, so those entries scale from their own numbers instead.
function rescaleEntryMacros(entry, newWeight) {
  const cachedFood = state.foodCache[entry.foodId];
  if (entryMatchesFood(entry, cachedFood)) return calcMacrosForWeight(cachedFood, newWeight);
  // This is now the single path every portion change goes through, including the live preview
  // that runs on each keystroke -- so a malformed entry has to degrade, not throw and blank
  // the screen.
  const macros = entry.macros || {};
  const oldWeight = positiveGramsOr(entry.weight, 0);
  // No usable old weight to scale from and no matching source food: the macros can't be
  // rescaled meaningfully, so keep them as they are rather than producing NaN/Infinity.
  if (oldWeight <= 0) return { calories: macros.calories || 0, protein: macros.protein || 0, carbs: macros.carbs || 0, fat: macros.fat || 0, fiber: macros.fiber || 0 };
  const ratio = newWeight / oldWeight;
  return {
    calories: Math.round((macros.calories || 0) * ratio),
    protein: round1((macros.protein || 0) * ratio),
    carbs: round1((macros.carbs || 0) * ratio),
    fat: round1((macros.fat || 0) * ratio),
    fiber: round1((macros.fiber || 0) * ratio),
  };
}

// Editing macros on a log entry only affects that entry \u2014 UNLESS it's a food you created
// yourself (a recipe or a manual/custom-barcode entry), in which case the correction is
// also written back to the source so future uses of it are already fixed.
//
// The corrected macros describe entry.weight grams -- NOT whatever portion the food was
// originally created at -- so baseGrams has to move with them. This was the reported "macros
// don't scale to the new weight" bug: correct a 83g manual food's macros while the entry sits
// at 166g and the food record kept claiming an 83g base, so a later portion change to 83g
// re-derived the exact same numbers (no visible change at all), and 166g doubled them.
// Writing loggedWeight/loggedMacros alongside keeps the History row (which prefers
// loggedMacros) showing the correction rather than the stale pre-edit numbers.
function propagateCustomFoodEdit(entry, newMacros) {
  if (entry.source === "Manual Entry" || entry.source === "Custom Barcode Entry") {
    const w = positiveGramsOr(entry.weight, 0);
    const updates = {
      calories: newMacros.calories, protein: newMacros.protein, carbs: newMacros.carbs, fat: newMacros.fat, fiber: newMacros.fiber,
    };
    if (w > 0) {
      updates.baseGrams = w;
      updates.loggedWeight = w;
      updates.loggedMacros = Object.assign({}, newMacros);
    }
    // Not just foodCache: History (recentFoods) and Favorites hold their own copies of the same
    // food, and re-adding from either of those was still handing back the uncorrected numbers.
    updateFoodRecordEverywhere(entry.foodId, updates);
    if (entry.source === "Custom Barcode Entry" && entry.foodId && entry.foodId.indexOf("barcode_") === 0) {
      const code = entry.foodId.slice("barcode_".length);
      if (state.customBarcodes[code]) {
        // customBarcodes rows are consumed by handleBarcodeDetected, which reads the portion off
        // servingSizes[0] -- so that has to be re-stated too, not just baseGrams.
        const barcodeUpdates = Object.assign({}, updates);
        if (w > 0) barcodeUpdates.servingSizes = [{ label: round1(w) + "g", grams: w }];
        barcodeUpdates.updatedAt = new Date().toISOString(); // conflict-resolution stamp (see mergeCustomBarcodesFromCloud)
        state.customBarcodes[code] = Object.assign({}, state.customBarcodes[code], barcodeUpdates);
        saveCustomBarcodes();
      }
    }
  } else if (entry.source === "Recipe" && entry.foodId && entry.foodId.indexOf("recipe_food_") === 0) {
    const recipeId = entry.foodId.slice("recipe_food_".length);
    const recipe = state.recipes.find(function(r){ return r.id === recipeId; });
    if (recipe) {
      const old = entry.macros;
      const ratioP = old.protein > 0 ? newMacros.protein / old.protein : 1;
      const ratioC = old.carbs > 0 ? newMacros.carbs / old.carbs : 1;
      const ratioF = old.fat > 0 ? newMacros.fat / old.fat : 1;
      const newIngredients = recipe.ingredients.map(function(ing) {
        const p2 = round1(ing.protein * ratioP), c2 = round1(ing.carbs * ratioC), f2 = round1(ing.fat * ratioF);
        return Object.assign({}, ing, { protein: p2, carbs: c2, fat: f2, calories: Math.round(p2 * 4 + c2 * 4 + f2 * 9) });
      });
      state.recipes = state.recipes.map(function(r){ return r.id === recipeId ? Object.assign({}, r, { ingredients: newIngredients, updatedAt: new Date().toISOString() }) : r; });
      saveRecipes();
    }
  }
}

actions.saveEditMacros = function() {
  const id = state.ui.editingEntryId;
  if (!id) return;
  const entry = (state.foodLogs[state.date] || []).find(function(e){ return e.id === id; });
  if (!entry) return;
  const p = Math.max(0, parseFloat(document.getElementById("editMacro_protein").value) || 0);
  const c = Math.max(0, parseFloat(document.getElementById("editMacro_carbs").value) || 0);
  const f = Math.max(0, parseFloat(document.getElementById("editMacro_fat").value) || 0);
  const fib = Math.max(0, parseFloat(document.getElementById("editMacro_fiber").value) || 0);
  // Calories comes from its own (auto-calculated-but-editable) field now, not always
  // recomputed from P/C/F -- so a correction that needs to account for alcohol's extra ~7
  // kcal/g isn't silently discarded on save.
  const cal = Math.max(0, parseFloat(document.getElementById("editMacroCaloriesInput").value) || 0);
  const newMacros = { protein: p, carbs: c, fat: f, fiber: fib, calories: cal };
  propagateCustomFoodEdit(entry, newMacros);
  updateFoodEntry(id, { macros: newMacros });
  closeEntryEditor();
  rerender();
};

actions.saveEntryDetails = function() {

  const override = state.ui.entryAnimalOverrideInput !== undefined ? state.ui.entryAnimalOverrideInput : prevOverride;
  updateFoodEntry(id, { name: name, brand: brand, animalOverride: override });
  // Plant-vs-animal is a property of the FOOD, not of one day's serving -- chicken doesn't stop
  // being animal protein tomorrow. So unlike name and brand, which are legitimately per-entry
  // ("Chicken" vs "Chicken (leftovers)") and stay on this entry alone, this one is written back
  // to the food record: every future log inherits it through addFoodToLog, and every past log
  // picks it up through isAnimalProteinEntry's fallback. Picking "Auto" writes null back too,
  // which is the intended way to undo a saved call and return the food to keyword guessing.
  if (entry.foodId && override !== prevOverride) {
    updateFoodRecordEverywhere(entry.foodId, { animalOverride: override });
  }
  closeEntryEditor();
  rerender();
};

// The scannable barcode number behind a logged entry, or null if it isn't a barcode item.
// Barcode-scanned items found in Open Food Facts carry foodId "off_<barcode>" and source
// "Open Food Facts (Barcode)"; ones typed in after a failed scan carry foodId "barcode_<code>".
// Deliberately excludes text-searched OFF results (also "off_" but source "Open Food Facts"),
// since their id may be an internal OFF id rather than a real scannable barcode.
function barcodeCodeForEntry(entry) {
  if (!entry || !entry.foodId) return null;
  if (entry.foodId.indexOf("barcode_") === 0) return entry.foodId.slice("barcode_".length);
  if (entry.source === "Open Food Facts (Barcode)" && entry.foodId.indexOf("off_") === 0) return entry.foodId.slice("off_".length);
  return null;
}

// Snapshots a logged barcode entry's CURRENT weight + macros into state.customBarcodes, keyed
// by the raw barcode. handleBarcodeDetected checks state.customBarcodes[code] before hitting
// Open Food Facts, so the next scan of this product uses the corrected numbers instead of the
// wrong ones OFF returned. Stored in the same per-serving shape as a hand-entered custom
// barcode, so it also shows up (and stays editable/deletable) in Strategy > Data > Custom
// Barcodes. Snapshots the entry as it stands, so fix the weight (Portion) and macros (Macros)
// first, then save the correction.
actions.saveBarcodeCorrection = function(entryId) {
  const entry = (state.foodLogs[state.date] || []).find(function(e){ return e.id === entryId; });
  if (!entry) return;
  const code = barcodeCodeForEntry(entry);
  if (!code) return;
  const w = positiveGramsOr(entry.weight, 100);
  const m = entry.macros;
  state.customBarcodes[code] = {
    id: "barcode_" + code, name: entry.name, brand: entry.brand || "", source: "Custom Barcode Entry",
    per100g: false, calories: m.calories, protein: m.protein, carbs: m.carbs, fat: m.fat, fiber: m.fiber || 0,
    state: "—", baseGrams: w, servingSizes: [{ label: round1(w) + "g", grams: w }],
    // Required, not decorative: mergeCustomBarcodesFromCloud resolves conflicts on this stamp,
    // and an unstamped correction can never beat the older copy already in the cloud.
    updatedAt: new Date().toISOString(),
  };
  saveCustomBarcodes();
  showToast("Saved — future scans will use this");
};

function moveFoodEntryToDate(entryId, toDate) {
  const fromDate = state.date;
  if (!toDate || toDate === fromDate) return false;
  const list = state.foodLogs[fromDate] || [];
  const idx = list.findIndex(function(e){ return e.id === entryId; });
  if (idx < 0) return false;
  const entry = list[idx];
  list.splice(idx, 1);
  state.foodLogs[fromDate] = list;
  if (!state.foodLogs[toDate]) state.foodLogs[toDate] = [];
  // updatedAt MUST be bumped: the move is a real edit, and it's the only thing
  // mergeFoodLogsFromCloud can use to tell that this device's copy is the newer one. Without
  // it the moved entry keeps its pre-move stamp, the merge sees cloud == local, and whichever
  // device pushed last silently wins -- the move bounces back to the original day.
  state.foodLogs[toDate].push(Object.assign({}, entry, { updatedAt: new Date().toISOString() }));
  saveFoodLogs();
  return true;
}

// Unlike moveFoodEntryToDate, copying to the same date the entry is already on is allowed --
// duplicating something logged today onto today ("ate a second serving") is a legitimate case,
// not a no-op to guard against. Leaves the editor open (no closeEntryEditor call) so copying
// the same item to several dates in a row doesn't require reopening it each time.
function copyFoodEntryToDate(entryId, toDate) {
  const fromDate = state.date;
  if (!toDate) return false;
  const list = state.foodLogs[fromDate] || [];
  const entry = list.find(function(e){ return e.id === entryId; });
  if (!entry) return false;
  const now = new Date().toISOString();
  const copy = Object.assign({}, entry, {
    id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    timestamp: now, updatedAt: now,
    photoExpires: entry.photo ? new Date(Date.now() + 2*24*60*60*1000).toISOString() : null,
  });
  if (!state.foodLogs[toDate]) state.foodLogs[toDate] = [];
  state.foodLogs[toDate].push(copy);
  saveFoodLogs();
  return true;
}

  const d = parseDateStr(state.date);
  d.setDate(d.getDate() - 1);
  const toDate = fmtDate(d);
  if (copyFoodEntryToDate(id, toDate)) { showToast("Copied to " + dayLabel(toDate)); return; } // showToast already rerenders

// Two deliberately separate groups: foods already eaten before (instant, local, no network)
// on top, then the online database hits underneath. They are NOT merged through
// deduplicateFoods together -- doing that folded a history item into a database row and
// stripped its "you've had this before" identity. Instead the database list simply drops
// anything already shown in the history group (by id), so nothing appears twice.
// The two-group body itself, shared verbatim by the Food tab's search and the recipe
// ingredient picker's search -- the picker used to render database hits only, so a food Colin
// had manually entered or eaten before was unreachable when building a recipe. Keeping one
// renderer (rather than a parallel copy) is what stops the two screens drifting apart again.
// Three groups, most-specific first: your own saved recipes, then foods you've eaten before,
// then the online databases. Recipes lead because they're the thing you built deliberately --
// and because they were previously unreachable from any search box at all.
function renderFoodResultGroups(cfg) {
  const recipes = cfg.recipes || [];
  const history = cfg.history || [];
  const dbResults = cfg.dbResults || [];
  let html = '';
  let groupsSoFar = 0;
  function separate() { if (groupsSoFar > 0) html += '<div style="height:6px"></div>'; groupsSoFar++; }

  if (recipes.length > 0 && cfg.recipeAction) {
    separate();
    html += resultsSectionHeader("\u{1F372} Your recipes", C.primary);
    recipes.forEach(function(recipe) { html += recipeResultRow(recipe, cfg.recipeAction); });
  }

  if (history.length > 0) {
    separate();
    html += resultsSectionHeader("★ Eaten before", C.warning);
    history.forEach(function(food) { html += foodResultRow(food, "history", cfg.action); });
  }

  if (dbResults.length > 0) {
    separate();
    html += resultsSectionHeader("Food databases", C.textMut);
    dbResults.forEach(function(food) { html += foodResultRow(food, null, cfg.action); });
  }

  if (cfg.searching) html += '<div style="text-align:center;padding:20px;color:' + C.textMut + '">Searching databases...</div>';
  else if (groupsSoFar === 0 && cfg.query) html += '<div style="text-align:center;padding:20px;color:' + C.textMut + '">' + esc(cfg.emptyText) + '</div>';
  return html;
}
