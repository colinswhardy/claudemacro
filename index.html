// Instant, synchronous matches against foods already logged, favorited, or fetched before --
// shown immediately as the user types (e.g. "ice-" surfaces a previously-added "Ice Cream")
// with no network round trip. The debounced live database search below layers remote hits on
// top of this once the user pauses typing.
// Shared match rule for every local food list (History, Favorites, and the search screen's
// "Eaten before" group). `q` must already be lowercased and trimmed by the caller.
// Brand is matched as well as name because a hand-added food is often remembered by its brand
// rather than the name typed on it -- "schneiders" should find the one logged as "Loonie Dog".
// The two fields are tested separately, not concatenated, so a query can't match by straddling
// the gap between them. Both are read defensively: a record missing either field is possible
// in older synced data, and a bare .toLowerCase() on it would throw and blank the whole list.
function foodMatchesQuery(food, q) {
  if (!food) return false;
  if (String(food.name || "").toLowerCase().indexOf(q) >= 0) return true;
  return String(food.brand || "").toLowerCase().indexOf(q) >= 0;
}

function localFoodMatches(q) {
  const seen = new Set();
  const out = [];
  function addFrom(list, cached) {
    list.forEach(function(f) {
      if (seen.has(f.id) || !foodMatchesQuery(f, q)) return;
      seen.add(f.id);
      out.push(cached ? Object.assign({}, f, { source: f.source + " (Cached)" }) : f);
    });
  }
  addFrom(state.recentFoods, false);
  addFrom(state.favorites, false);
  addFrom(Object.values(state.foodCache), true);
  return out;
}

function filterFoodsByQuery(list, query) {
  const q = (query || "").trim().toLowerCase();
  if (!q) return list;
  return list.filter(function(f){ return foodMatchesQuery(f, q); });
}

// ---- Recipes as a search result ----
// Saved recipes used to be reachable only by going to the Recipes sub-tab and reading down the
// list. They're matched by name only (a recipe has no brand, and matching ingredient names
// would surface "Chili" for a search of "onion" -- a result the row gives no way to explain).
function recipeMatchesQuery(recipe, q) {
  if (!recipe) return false;
  return String(recipe.name || "").toLowerCase().indexOf(q) >= 0;
}
// `q` already lowercased/trimmed by the caller, same contract as foodMatchesQuery.
function matchingRecipes(q) {
  return (state.recipes || []).filter(function(r){ return recipeMatchesQuery(r, q); });
}
function filterRecipesByQuery(list, query) {
  const q = (query || "").trim().toLowerCase();
  if (!q) return list;
  return list.filter(function(r){ return recipeMatchesQuery(r, q); });
}

// Logging a recipe stores a snapshot food under the id "recipe_food_<recipeId>", so a recipe
// eaten before matches BOTH groups and would otherwise render twice under the same name. The
// recipe row wins here (unlike dbResultsExcludingHistory, where history wins): it re-reads the
// recipe's current ingredients, whereas the snapshot is frozen at whatever the recipe looked
// like the day it was logged and silently goes stale the moment the recipe is edited.
function recipeSnapshotFoodId(recipeId) { return "recipe_food_" + recipeId; }
function historyExcludingRecipes(recipeList, historyFoods) {
  const shown = new Set((recipeList || []).map(function(r){ return recipeSnapshotFoodId(r.id); }));
  return (historyFoods || []).filter(function(f){ return !shown.has(f.id); });
}

// A recipe rendered as one food: its ingredient totals, anchored to the recipe's own full
// weight via baseGrams so calcMacrosForWeight scales a partial portion correctly. Used where a
// recipe has to behave like any other food (currently: as an ingredient of another recipe).
function recipeAsFood(recipe) {
  const t = sumRecipeIngredients(recipe.ingredients);
  const w = positiveGramsOr(t.weight, 100);
  return {
    id: recipeSnapshotFoodId(recipe.id), name: recipe.name, source: "Recipe", per100g: false,
    calories: Math.round(t.calories), protein: round1(t.protein), carbs: round1(t.carbs),
    fat: round1(t.fat), fiber: round1(t.fiber),
    state: "—", loggedWeight: w, baseGrams: w,
    servingSizes: [{ label: "Full recipe", grams: w }],
  };
}

// Editing a food's stored record (its name/brand/macros/protein-source), reached from the
// History tab -- as opposed to renderEntryEditor, which edits one day's LOGGED entry. Only
// Macros + Details apply here (no Portion/Move/Copy -- there's no specific day or weight to
// relocate, just the food definition itself). Saves via updateFoodRecordEverywhere so the
// correction is visible the next time this food is re-added from History, Favorites, or search.
function renderFoodRecordEditor(food) {

// Applies a correction to a food's stored record everywhere it might be cached -- History
// (recentFoods), Favorites, and the general food-lookup cache -- so re-adding it from ANY of
// those places uses the corrected data, not just the one list the user happened to edit from.
// Mirrors propagateCustomFoodEdit's reasoning (a log-entry edit propagating to its source) but
// generalized to any food, editable directly rather than only via a logged instance.
// Each store is updated independently: a food can legitimately be in the cache but not in
// History (History is capped at 500 and old entries fall off), and bailing out on the first
// miss used to mean a correction reached none of the others. Returns whether anything matched.
function updateFoodRecordEverywhere(foodId, updates) {
  if (!foodId) return false;
  // Stamped so the whole-blob merges can carry this correction to other devices. Without it
  // the fix is local-only: a device that already holds this food id keeps its own stale copy
  // forever, because those merges can only ever ADD (see foodRecordIsNewer).
  const stamped = Object.assign({}, updates, { updatedAt: new Date().toISOString() });
  let touched = false;
  const idx = state.recentFoods.findIndex(function(f){ return f.id === foodId; });
  if (idx >= 0) { state.recentFoods[idx] = Object.assign({}, state.recentFoods[idx], stamped); saveRecentFoods(); touched = true; }
  const favIdx = state.favorites.findIndex(function(f){ return f.id === foodId; });
  if (favIdx >= 0) { state.favorites[favIdx] = Object.assign({}, state.favorites[favIdx], stamped); saveFavorites(); touched = true; }
  if (state.foodCache[foodId]) { state.foodCache[foodId] = Object.assign({}, state.foodCache[foodId], stamped); saveFoodCache(); touched = true; }
  return touched;
}

actions.saveFoodRecordMacros = function(foodId) {
  const food = state.recentFoods.find(function(f){ return f.id === foodId; });
  if (!food) return;
  const p = Math.max(0, parseFloat(document.getElementById("editMacro_protein").value) || 0);
  const c = Math.max(0, parseFloat(document.getElementById("editMacro_carbs").value) || 0);
  const f = Math.max(0, parseFloat(document.getElementById("editMacro_fat").value) || 0);
  const fib = Math.max(0, parseFloat(document.getElementById("editMacro_fiber").value) || 0);
  // Calories comes from its own (auto-calculated-but-editable) field, not always recomputed
  // from P/C/F -- so it can account for alcohol's extra ~7 kcal/g, which P/C/F alone misses.
  const cal = Math.max(0, parseFloat(document.getElementById("editMacroCaloriesInput").value) || 0);
  // baseGrams is written explicitly (not left to be re-derived) because the edit form states
  // the basis to the user, so that basis has to be pinned to what they were shown rather than
  // re-inferred later from a field a re-log may have moved. For an absolute-portion food the
  // user can now edit that basis directly (the repair path for a drifted record); a per-100g
  // food has no editable basis, so it keeps its derived 100.
  const editedBase = food.per100g ? null : foodUi().foodEditBaseInput;
  const base = editedBase != null ? positiveGramsOr(editedBase, foodBaseGrams(food)) : foodBaseGrams(food);
  const updates = { protein: p, carbs: c, fat: f, fiber: fib, calories: cal, baseGrams: base };
  // Rescale the "last logged" snapshot to the corrected base, at the same weight as before --
  // otherwise re-adding this food would still show the old numbers via loggedMacros
  // (addFoodToLog prefers loggedMacros over the base fields whenever both are present).
  // Restated unconditionally rather than only when loggedWeight is set: a record carrying a
  // stale loggedMacros but no usable loggedWeight would otherwise keep that stale snapshot
  // winning over every corrected field above.
  const lastWeight = positiveGramsOr(food.loggedWeight, updates.baseGrams);
  updates.loggedWeight = lastWeight;
  updates.loggedMacros = calcMacrosForWeight(Object.assign({}, food, updates), lastWeight);
  updateFoodRecordEverywhere(foodId, updates);
  closeFoodRecordEditor();
  rerender();
};

};

let foodSearchDebounceTimer = null;
let foodSearchSeq = 0;

inputActions.foodQuery = function(val) {
  const fu = foodUi();
  fu.query = val;
  fu.wizardSuggestion = detectWizard(val);
  foodSearchSeq++; // invalidate any live search still in flight from an earlier keystroke
  clearTimeout(foodSearchDebounceTimer);

  const q = val.trim().toLowerCase();
  // Saved recipes and previously-eaten foods appear from the very first character -- both are
  // local, synchronous lookups with no network cost, and surfacing them instantly is the whole
  // point of those groups.
  fu.recipeResults = q.length >= 1 ? matchingRecipes(q) : [];
  fu.historyResults = q.length >= 1 ? historyExcludingRecipes(fu.recipeResults, localFoodMatches(q)) : [];
  fu.results = []; // database hits arrive below, once the debounced search returns
  fu.searching = false;
  patchFoodResultsBlock();

  if (q.length < 3) return; // too short to bother the (rate-limited) remote databases
  const mySeq = foodSearchSeq;
  foodSearchDebounceTimer = setTimeout(function() { liveFoodSearch(q, mySeq); }, 450);
};

// Database results, minus anything already listed in the "Eaten before" group, so a food the
// user has had before shows once (in history) rather than twice.
function dbResultsExcludingHistory(historyList, dbFoods) {
  const historyIds = new Set((historyList || []).map(function(f){ return f.id; }));
  return deduplicateFoods(dbFoods).filter(function(f){ return !historyIds.has(f.id); });
}

// Debounced as-you-type database search, fired from inputActions.foodQuery after a pause in
// typing so a fast typist doesn't send a USDA + Open Food Facts request per keystroke -- USDA
// in particular runs on a shared, rate-limited demo key (see CLAUDE.md). mySeq guards against
// an older, slower request resolving after a newer one and clobbering fresher results with
// stale ones -- a real risk once searches can overlap, unlike the old tap/Enter-only flow.
async function liveFoodSearch(q, mySeq) {
  const fu = foodUi();
  fu.searching = true;
  patchFoodResultsBlock();
  const usdaP = searchUSDA(q);
  const offP = searchOpenFoodFacts(q);
  const usda = await usdaP, off = await offP;
  if (mySeq !== foodSearchSeq) return; // superseded by further typing or an explicit search
  fu.recipeResults = matchingRecipes(q);
  fu.historyResults = historyExcludingRecipes(fu.recipeResults, localFoodMatches(q));
  fu.results = dbResultsExcludingHistory(fu.historyResults, usda.concat(off));
  fu.searching = false;
  patchFoodResultsBlock();
}

actions.doFoodSearch = async function() {
  const fu = foodUi();
  const q = fu.query.trim();
  if (!q) return;
  clearTimeout(foodSearchDebounceTimer);
  const mySeq = ++foodSearchSeq;
  const qLower = q.toLowerCase();
  fu.searching = true;
  fu.wizardSuggestion = detectWizard(fu.query);
  fu.recipeResults = matchingRecipes(qLower);
  fu.historyResults = historyExcludingRecipes(fu.recipeResults, localFoodMatches(qLower));
  fu.results = [];
  rerender();

  const usdaP = searchUSDA(q);
  const offP = searchOpenFoodFacts(q);
  const usda = await usdaP, off = await offP;
  if (mySeq !== foodSearchSeq) return; // superseded by further typing or another explicit search
  fu.recipeResults = matchingRecipes(qLower);
  fu.historyResults = historyExcludingRecipes(fu.recipeResults, localFoodMatches(qLower));
  fu.results = dbResultsExcludingHistory(fu.historyResults, usda.concat(off));
  fu.searching = false;
  rerender();
};

// ---- Scan confirmation window (added 2026-08-10) ----
// The scan loop used to accept the very FIRST frame BarcodeDetector returned anything for, and
// act on it immediately. That first frame is the worst one available: the camera is still
// autofocusing and metering, so a partial or misread value is entirely normal there -- and a
// misread code is a code no database has, which surfaced as "this barcode doesn't exist" for a
// product that scans fine on the second try. The retry worked not because the barcode changed
// but because by then the camera had settled.
//
// So a value now has to be READ TWICE, and those reads have to span at least 200ms, before it
// counts. That's the ~0.2s Colin offered to trade for accuracy, and it's spent on the specific
// thing that was going wrong: a one-frame misread is discarded because the next read disagrees
// with it, while a genuine barcode reads the same every frame and confirms as fast as the
// window allows.
const BARCODE_CONFIRM_MS = 200;
const BARCODE_CONFIRM_MIN_READS = 2;
// How long a partial confirmation survives without a fresh sighting.
const BARCODE_CONFIRM_STALE_MS = 1500;
// Pure: (pending, codeSeenThisFrame|null, now) -> {pending, accepted}. Unit-tested directly.
function barcodeScanConfirm(pending, code, now) {
  // A frame that reads nothing does NOT reset progress. A blurred or shaky frame between two
  // good reads is completely normal, and starting over on each one would make confirmation take
  // arbitrarily long -- turning a fix for "too fast" into a scanner that never fires. Progress
  // does go stale on its own timer instead: past BARCODE_CONFIRM_STALE_MS since the last
  // sighting it starts over, so a code glimpsed once and then lost can't pair up with a single
  // fresh read much later to manufacture a confirmation neither of them earned.
  const alive = (pending && (now - pending.lastSeenAt) <= BARCODE_CONFIRM_STALE_MS) ? pending : null;
  if (!code) return { pending: alive, accepted: null };
  // A DIFFERENT value does reset, and that's the whole point: it's the disagreement between two
  // frames that identifies one of them as a misread.
  if (!alive || alive.code !== code) return { pending: { code: code, firstSeenAt: now, lastSeenAt: now, reads: 1 }, accepted: null };
  const next = { code: code, firstSeenAt: alive.firstSeenAt, lastSeenAt: now, reads: alive.reads + 1 };
  const settled = next.reads >= BARCODE_CONFIRM_MIN_READS && (now - next.firstSeenAt) >= BARCODE_CONFIRM_MS;
  return { pending: next, accepted: settled ? code : null };
}
// Patched directly, never via rerender(): a rerender rebuilds the <video> element and would
// tear down the camera stream mid-scan. Same no-rerender discipline the typed inputs follow,
// for a different reason.
function patchBarcodeScanHint(pending) {
  const el = document.getElementById("barcodeScanHint");
  if (!el) return;
  el.textContent = pending ? "Reading " + pending.code + " — hold steady…" : "";
}

async function startBarcodeCamera() {
  const fu = foodUi();
  if (!("BarcodeDetector" in window)) {
    fu.scanError = "Live camera scanning isn't supported in this browser — use manual entry below.";
    rerender();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    if (!foodUi().scanningBarcode) { stream.getTracks().forEach(function(t){ t.stop(); }); return; } // closed while awaiting permission
    barcodeStream = stream;
    const video = document.getElementById("barcodeVideo");
    if (!video) { stopBarcodeCamera(); return; }
    video.srcObject = stream;
    await video.play();
    const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
    // Confirmation progress for the current candidate code. Scoped to this closure, so opening
    // the scanner again always starts clean without needing an explicit reset.
    let pendingScan = null;
    const tick = async function() {
      if (!foodUi().scanningBarcode) return;
      try {
        const codes = await detector.detect(video);
        const step = barcodeScanConfirm(pendingScan, codes.length > 0 ? codes[0].rawValue : null, Date.now());
        pendingScan = step.pending;
        patchBarcodeScanHint(step.pending);
        if (step.accepted) {
          stopBarcodeCamera();
          handleBarcodeDetected(step.accepted);
          return;
        }
      } catch (e) { /* keep trying next frame */ }
      barcodeDetectionRAF = requestAnimationFrame(tick);
    };
    barcodeDetectionRAF = requestAnimationFrame(tick);
  } catch (e) {
    foodUi().scanError = "Couldn't access camera (" + e.message + ") — use manual entry below.";
    rerender();
  }
}

// The single hand-off point for a successful barcode lookup. Where the scanned food lands
// depends on where the scan was started from: normally the Food tab's Adding Food screen, but
// the recipe ingredient picker's portion screen when fu.scanTarget says the scan came from
// there. Everything before this point -- the camera, the manual-code box, the customBarcodes
// lookup, the not-found form -- is shared verbatim by both, so this is the only fork.
function deliverScannedFood(food, weightStr) {
  const fu = foodUi();
  // A lookup can still be in flight when the user backs out of the scan screen, so a delivery
  // that arrives after that has to be dropped: it would otherwise drag them into a screen they
  // had already left. That matters most on the ingredient path, where the fallback isn't a
  // no-op but the Food tab's Adding Food screen -- i.e. logging the item to today's log
  // instead of adding it to the recipe they were building.
  if (!fu.scanningBarcode) return;
  const forIngredient = fu.scanTarget === "ingredient";
  const rb = fu.recipeBuilder;
  const pk = rb && rb.picker ? rb.picker : null;
  fu.scanningBarcode = false;
  fu.scanTarget = null;
  fu.scanNotFoundCode = null;
  if (forIngredient) {
    if (!pk) { rerender(); return; } // picker closed underneath the scan -- nothing to add to
    pk.selecting = food;
    pk.weight = weightStr;
    pk.servingBasis = null; pk.qty = "1";
    pendingFocusId = "ingredientWeightInput";
  } else {
    fu.addingFood = food;
    fu.addWeight = weightStr;
    fu.addServingBasis = null; fu.addQty = "1";
    pendingFocusId = "addWeightInput";
  }
  rerender();
}

async function handleBarcodeDetected(code) {
  const fu = foodUi();
  fu.scanNotFoundCode = null;

  const remembered = state.customBarcodes[code];
  if (remembered) {
    deliverScannedFood(remembered, String(remembered.loggedWeight || (remembered.servingSizes && remembered.servingSizes[0] && remembered.servingSizes[0].grams) || ""));
    return;
  }

  fu.scanLoading = true; fu.scanError = null;
  rerender();
  const food = await searchBarcode(code);
  fu.scanLoading = false;
  if (!fu.scanningBarcode) return; // backed out while the lookup was in flight
  if (!food) {
    fu.scanNotFoundCode = code;
    fu.customBarcodeManual = { name: "", weight: "100", calories: "", protein: "", carbs: "", fat: "", fiber: "" };
    rerender();
    return;
  }
  deliverScannedFood(food, "");
}

function sumRecipeIngredients(ingredients) {
  return (ingredients || []).reduce(function(acc, i) {
    return {
      weight: acc.weight + (i.weight || 0),
      calories: acc.calories + (i.calories || 0),
      protein: acc.protein + (i.protein || 0),
      carbs: acc.carbs + (i.carbs || 0),
      fat: acc.fat + (i.fat || 0),
      fiber: acc.fiber + (i.fiber || 0),
    };
  }, { weight: 0, calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
}

// Ingredient search mirrors the Food tab's search exactly (see inputActions.foodQuery): an
// instant local "Eaten before" group from the 1st character, plus a debounced database search
// underneath. Its own seq/timer rather than the Food tab's, so the two can never invalidate
// each other's in-flight requests.
let ingredientSearchDebounceTimer = null;
let ingredientSearchSeq = 0;

// The picker object is recreated on every open and nulled on close, so an async search that
// resolves after the user backed out (or reopened the picker) must not write into a detached
// one -- identity, not just the seq counter, is what makes that safe.
function ingredientPickerIsCurrent(pk) {
  const rb = foodUi().recipeBuilder;
  return !!(rb && rb.picker === pk);
}

// A saved recipe can be dropped into another recipe as a single ingredient (a sauce inside a
// meal, say) -- except itself: while editing a recipe it's excluded from its own ingredient
// search, since its totals at that moment are exactly what's being edited.
function pickerRecipeMatches(rb, q) {
  return matchingRecipes(q).filter(function(r){ return r.id !== rb.editingId; });
}

      '<span style="color:' + C.carbs + '">C: ' + m.carbs + 'g</span>' +

// Browsing History while building a recipe, not just searching it. The picker's search already
// surfaces a previously-eaten food from the 1st character, but only if you can remember enough
// of its name to type -- History is the 500-entry "everything ever added" list, and scrolling
// it is how you find the thing you can't name. Its own filter (rather than reusing the Food
// tab's fu.historyQuery) so the two screens' filters don't leak into each other.
function renderPickerHistoryListBlock(pk) {
  if (state.recentFoods.length === 0) {
    return '<div style="text-align:center;padding:20px;color:' + C.textMut + '">No food history yet.</div>';
  }
  const list = filterFoodsByQuery(state.recentFoods, pk.historyQuery);
  if (list.length === 0) {
    return '<div style="text-align:center;padding:20px;color:' + C.textMut + '">No matches for “' + esc(pk.historyQuery) + '”</div>';
  }
  return list.map(function(food) { return pickerBrowseRow(food, "history"); }).join('');
}
// Patched into #pickerHistoryListBlock as the filter is typed, never via rerender() -- same
// no-rerender-on-keystroke rule the Food tab's own History filter follows.
inputActions.pickerHistoryQuery = function(val) {
  const rb = foodUi().recipeBuilder;
  if (!rb || !rb.picker) return;
  rb.picker.historyQuery = val;
  const el = document.getElementById("pickerHistoryListBlock");
  if (el) el.innerHTML = renderPickerHistoryListBlock(rb.picker);
};

inputActions.ingredientQuery = function(val) {
  const rb = foodUi().recipeBuilder;
  if (!rb || !rb.picker) return;
  const pk = rb.picker;
  pk.query = val;
  ingredientSearchSeq++; // invalidate any live search still in flight from an earlier keystroke
  clearTimeout(ingredientSearchDebounceTimer);

  const q = val.trim().toLowerCase();
  pk.recipeResults = q.length >= 1 ? pickerRecipeMatches(rb, q) : [];
  pk.historyResults = q.length >= 1 ? historyExcludingRecipes(pk.recipeResults, localFoodMatches(q)) : [];
  pk.results = [];
  pk.searching = false;
  patchIngredientResultsBlock();

  if (q.length < 3) return; // too short to bother the (rate-limited) remote databases
  const mySeq = ingredientSearchSeq;
  ingredientSearchDebounceTimer = setTimeout(function() { liveIngredientSearch(q, mySeq, pk); }, 450);
};

async function liveIngredientSearch(q, mySeq, pk) {
  if (!ingredientPickerIsCurrent(pk)) return;
  pk.searching = true;
  patchIngredientResultsBlock();
  const usdaP = searchUSDA(q);
  const offP = searchOpenFoodFacts(q);
  const usda = await usdaP, off = await offP;
  if (mySeq !== ingredientSearchSeq || !ingredientPickerIsCurrent(pk)) return;
  pk.recipeResults = pickerRecipeMatches(foodUi().recipeBuilder, q);
  pk.historyResults = historyExcludingRecipes(pk.recipeResults, localFoodMatches(q));
  pk.results = dbResultsExcludingHistory(pk.historyResults, usda.concat(off));
  pk.searching = false;
  patchIngredientResultsBlock();
}

actions.doIngredientSearch = async function() {
  const rb = foodUi().recipeBuilder;
  if (!rb || !rb.picker) return;
  const pk = rb.picker;
  const q = (pk.query || "").trim();
  if (!q) return;
  clearTimeout(ingredientSearchDebounceTimer);
  const mySeq = ++ingredientSearchSeq;
  const qLower = q.toLowerCase();
  pk.searching = true;
  pk.recipeResults = pickerRecipeMatches(rb, qLower);
  pk.historyResults = historyExcludingRecipes(pk.recipeResults, localFoodMatches(qLower));
  pk.results = [];
  rerender();

  const usdaP = searchUSDA(q);
  const offP = searchOpenFoodFacts(q);
  const usda = await usdaP, off = await offP;
  if (mySeq !== ingredientSearchSeq || !ingredientPickerIsCurrent(pk)) return;
  pk.recipeResults = pickerRecipeMatches(rb, qLower);
  pk.historyResults = historyExcludingRecipes(pk.recipeResults, localFoodMatches(qLower));
  pk.results = dbResultsExcludingHistory(pk.historyResults, usda.concat(off));
  pk.searching = false;
  rerender();
};
actions.selectIngredientFood = function(foodId, srcTab) {
  const rb = foodUi().recipeBuilder;
  if (!rb || !rb.picker) return;
  const pk = rb.picker;
  // Same defensive lookup order as selectFoodForAdd, and for the same reason: an "Eaten before"
  // row can originate from favorites or the food cache, not just recentFoods, so the history
  // list has to be searched directly rather than inferred from srcTab.
  let food = (pk.results || []).find(function(f){ return f.id === foodId; });
  if (!food) food = (pk.historyResults || []).find(function(f){ return f.id === foodId; });
  if (!food && srcTab === "history") food = state.recentFoods.find(function(f){ return f.id === foodId; });
  if (!food && srcTab === "favorites") food = state.favorites.find(function(f){ return f.id === foodId; });
  if (!food) food = state.foodCache[foodId];
  if (!food) return;
  pk.selecting = food;
  pk.weight = "";
  pk.servingBasis = null; pk.qty = "1";
  pendingFocusId = "ingredientWeightInput";
  rerender();
};

actions.logRecipe = function(id) {
  const recipe = state.recipes.find(function(r){ return r.id === id; });
  if (!recipe) return;
  const totals = sumRecipeIngredients(recipe.ingredients);
  const fu = foodUi();
  fu.loggingRecipe = recipe;
  fu.loggingWeight = String(round1(totals.weight) || 100);
  rerender();
};
actions.cancelLogRecipe = function() { stepBackOneLevel(); };
inputActions.loggingRecipeWeight = function(val) { foodUi().loggingWeight = val; };
actions.confirmLogRecipe = function() {
  const fu = foodUi();
  const recipe = fu.loggingRecipe;
  if (!recipe) return;
  const w = parseFloat(fu.loggingWeight);
  // Guard before the debounce lock is spent, and before logging a 0g/0-macro placeholder entry
  // the user would then have to hunt down and delete (the Add button isn't disabled here).
  if (!(w > 0)) return;
  const now = Date.now();
  if (fu._confirmLock && now - fu._confirmLock < 600) return;
  fu._confirmLock = now;
  const totals = sumRecipeIngredients(recipe.ingredients);
  const ratio = totals.weight > 0 ? w / totals.weight : 0;
  const m = { calories: Math.round(totals.calories * ratio), protein: round1(totals.protein * ratio), carbs: round1(totals.carbs * ratio), fat: round1(totals.fat * ratio), fiber: round1(totals.fiber * ratio) };
  addFoodToLog({
    id: "recipe_food_" + recipe.id, name: recipe.name, source: "Recipe",
    calories: m.calories, protein: m.protein, carbs: m.carbs, fat: m.fat, fiber: m.fiber,
    // The macros above are absolute for exactly w grams of the recipe, so w is the base.
    state: "—", loggedWeight: w, baseGrams: w, loggedMacros: m, timestamp: new Date().toISOString(),
  });
  stepBackOneLevel();
};

actions.selectFoodForAdd = function(foodId, srcTab) {
  const fu = foodUi();
  // Every list below is read defensively: foodUi() seeds them all, but this action is also
  // reachable from a restored/partially-initialised ui object, and an unguarded .find on an
  // undefined list throws inside the click handler and takes the whole screen down.
  let food = (fu.results || []).find(function(f){ return f.id === foodId; });
  // The search screen's "Eaten before" group lives in its own list, separate from the database
  // results, so it has to be searched too -- those rows can come from favorites or the food
  // cache, not just recentFoods, and would otherwise fall through the srcTab checks below.
  if (!food) food = (fu.historyResults || []).find(function(f){ return f.id === foodId; });
  if (!food && srcTab === "history") food = state.recentFoods.find(function(f){ return f.id === foodId; });
  if (!food && srcTab === "favorites") food = state.favorites.find(function(f){ return f.id === foodId; });
  if (!food) food = state.foodCache[foodId];
  if (!food) return;
  fu.addingFood = food;
  fu.addWeight = food.loggedWeight ? String(food.loggedWeight) : "";
  fu.addServingBasis = null; fu.addQty = "1";
  pendingFocusId = "addWeightInput";
  rerender();
};

// Shared by the three "pick a serving size, then dial in quantity or grams" screens (adding a
// food from search, picking a recipe ingredient, and the wizard's result screen): tapping a
// serving chip like "1 cookie (33g)" lets you type a quantity ("2") instead of calculating
// grams yourself. Each screen keeps its own weight/servingBasis/qty state (different
// containers), but the math and the calorie-preview DOM patching are identical, so they're
// factored out here instead of tripled. Patching (not a full rerender) matters because a
// rerender mid-keystroke would blur the input the user is actively typing into.
function computeQtyWeight(qty, basisGrams) {
  return round1((parseFloat(qty) || 0) * basisGrams);
}
function patchMacroPreview(idPrefix, food, weight) {
  const m = calcMacrosForWeight(food, weight);
  const calEl = document.getElementById(idPrefix + "Cal");
  if (calEl) calEl.textContent = m.calories;
  const proEl = document.getElementById(idPrefix + "Pro");
  if (proEl) proEl.textContent = m.protein + "g";
  const carbEl = document.getElementById(idPrefix + "Carb");
  if (carbEl) carbEl.textContent = m.carbs + "g";
  const fatEl = document.getElementById(idPrefix + "Fat");
  if (fatEl) fatEl.textContent = m.fat + "g";
  return m;
}
// Renders the serving-size chips plus, depending on mode, either a quantity input ("2" x this
// serving) or a plain grams input. cfg: { food, weight, servingBasis, qty, chipAction,
// weightInputId, weightBind, qtyInputId, qtyBind, qtyReadoutId, enterAction, useGramsAction,
// compact (tighter spacing for the ingredient picker's smaller card) }.
function renderServingControls(cfg) {
  const gapBottom = cfg.compact ? "12px" : "16px";
  let html = '<div class="rowWrap" style="margin-bottom:' + gapBottom + '">' +
    (cfg.food.servingSizes || []).map(function(s) {
      const active = cfg.servingBasis === s.grams;
      return '<button class="chip' + (active ? ' active' : '') + '" data-action="' + cfg.chipAction + '" data-arg="' + s.grams + '">' + esc(s.label) + '</button>';
    }).join('') +
  '</div>';
  if (cfg.servingBasis) {
    html += '<div class="row" style="align-items:center;margin-bottom:8px">' +
      textInput({ id: cfg.qtyInputId, value: cfg.qty, type: "number", bind: cfg.qtyBind, enter: cfg.enterAction, style: "width:90px" }) +
      '<span id="' + cfg.qtyReadoutId + '" style="color:' + C.textMut + ';font-size:13px;align-self:center">× ' + round1(cfg.servingBasis) + 'g each = ' + round1(cfg.weight) + 'g</span>' +
    '</div>';
    html += '<div style="margin-bottom:' + (cfg.compact ? "12px" : "20px") + '">' + btn({ label: "Enter grams instead", action: cfg.useGramsAction, outline: true, small: true }) + '</div>';
  } else {
    html += '<div class="row" style="align-items:center;margin-bottom:' + (cfg.compact ? "12px" : "20px") + '">' +
      textInput({ id: cfg.weightInputId, value: cfg.weight, type: "number", bind: cfg.weightBind, enter: cfg.enterAction, style: "flex:1" }) +
      '<span style="color:' + C.textMut + (cfg.compact ? ';font-size:13px' : '') + ';align-self:center">grams</span>' +
    '</div>';
  }
  return html;
}

actions.confirmAddFood = function() {
  const fu = foodUi();
  const food = fu.addingFood;
  if (!food) return;
  const w = parseFloat(fu.addWeight);
  if (!w || w <= 0) return;
  const now = Date.now();
  if (fu._confirmLock && now - fu._confirmLock < 600) return;
  fu._confirmLock = now;
  const m = calcMacrosForWeight(food, w);
  // anchorFoodBase BEFORE loggedWeight is overwritten: addFoodToLog writes this object straight
  // into recentFoods (History), and for a food with no servingSizes -- every AI Estimate, every
  // recipe log -- loggedWeight IS what foodBaseGrams falls back to. Re-logging at a new weight
  // without freezing the base first re-anchored the food's unchanged absolute macros to the new
  // portion, so each re-add silently rescaled the food (400g/500kcal re-added at 200g then back
  // at 400g came out as 1000 kcal), compounding every time.
  addFoodToLog(Object.assign({}, anchorFoodBase(food), { loggedWeight: w, loggedMacros: m, timestamp: new Date().toISOString() }));
  fu.query = ""; fu.results = []; fu.historyResults = []; fu.recipeResults = [];
  stepBackOneLevel();
};

actions.toggleFavorite = function(foodId) {
  const fu = foodUi();
  const existing = state.favorites.find(function(f){ return f.id === foodId; });
  if (existing) {
    state.favorites = state.favorites.filter(function(f){ return f.id !== foodId; });
  } else {
    const now = new Date().toISOString();
    let food = fu.addingFood && fu.addingFood.id === foodId ? fu.addingFood : ((fu.results || []).find(function(f){ return f.id === foodId; }) || state.foodCache[foodId]);
    if (food) state.favorites.unshift(Object.assign({}, food, { addedAt: now, updatedAt: now }));
  }
  saveFavorites();
  rerender();
};

// protein/carbs/fat -> calories, shared by Manual Entry and the "barcode not found" custom entry
// screen (both let you type raw macros for a food that isn't in any database). Atwater factors
// (4/4/9) match the ones already used for recipe-ingredient scaling and the Strategy tab's
// calorie<->macro target math.
function calcCaloriesFromMacros(protein, carbs, fat) {
  return Math.round((parseFloat(protein) || 0) * 4 + (parseFloat(carbs) || 0) * 4 + (parseFloat(fat) || 0) * 9);
}

    carb = Math.max(0, parseFloat(m.carbs) || 0), ft = Math.max(0, parseFloat(m.fat) || 0), fib = Math.max(0, parseFloat(m.fiber) || 0);
  const weight = positiveGramsOr(m.weight, 100);
  const food = {
    id: "manual_" + Date.now(), name: m.name || "Custom Food", source: "Manual Entry",

    loggedWeight: weight,
    loggedMacros: { calories: cal, protein: pro, carbs: carb, fat: ft, fiber: fib },
    // Anchors the absolute macros above to the portion they describe, so re-adding this from
    // History later doesn't rescale them against an assumed 100g base (see foodBaseGrams).
    baseGrams: weight,
    timestamp: new Date().toISOString(), per100g: false,

// Save what's typed on the Manual Entry screen as a one-ingredient recipe (added 2026-08-10).
//
// A manual food already lands in History and can be re-added, so what this buys is the thing
// only a recipe is: a definition that stays editable as a COMPOSITION. It can be re-logged at
// any weight against its own total, gain ingredients later, and be nested inside another
// recipe -- none of which a fixed History record can do.
//
// Deliberately does NOT log anything to today. "Add to Log" sits right beside it, and saving a
// reusable definition and eating a serving of it are two different intentions; doing both is
// just two taps. It stays on the screen afterwards for exactly that reason.
actions.saveManualAsRecipe = function() {
  const fu = foodUi();
  const m = fu.manual;
  const name = (m.name || "").trim();
  // Checked here rather than by disabling the button: the name field doesn't rerender on
  // keystroke (see the no-rerender-on-keystroke rule), so a `disabled` computed at render time
  // would be stale the moment he typed. addManualEntry can default an unnamed food to "Custom
  // Food"; a recipe can't -- the name is how it's found again.
  if (!name) { showToast("Give it a name first"); return; }
  const now = Date.now();
  // Its own lock, not the shared fu._confirmLock: this action doesn't exit the screen, and
  // sharing one would make "Save as Recipe" then "Add to Log" swallow the second tap.
  if (fu._recipeSaveLock && now - fu._recipeSaveLock < 600) return;
  fu._recipeSaveLock = now;
  const weight = positiveGramsOr(m.weight, 100);
  const stamp = new Date().toISOString();
  state.recipes.push({
    id: "recipe_" + now,
    name: name,
    // One ingredient holding the whole thing. sumRecipeIngredients totals the list, so the
    // recipe's own weight and macros come out exactly as typed, and adding a second ingredient
    // later needs no special case anywhere.
    ingredients: [{
      id: "ing_" + now + "_" + Math.random().toString(36).slice(2,7),
      name: name, weight: weight,
      calories: Math.max(0, parseFloat(m.calories) || 0), protein: Math.max(0, parseFloat(m.protein) || 0),
      carbs: Math.max(0, parseFloat(m.carbs) || 0), fat: Math.max(0, parseFloat(m.fat) || 0),
      fiber: Math.max(0, parseFloat(m.fiber) || 0),
    }],
    createdAt: stamp,
    updatedAt: stamp, // conflict-resolution stamp (see mergeRecipesFromCloud)
  });
  saveRecipes();
  showToast("Saved to Recipes");
};

function renderAiComparison(fu) {
  if (!fu.aiCompareError && !fu.aiCompareResults) return '';
  let html = '<div style="margin-top:4px;margin-bottom:16px">';
  html += '<div style="color:' + C.textSec + ';font-size:13px;font-weight:600;margin-bottom:8px">Gemini Comparison</div>';
  if (fu.aiCompareError) {
    html += '<div style="padding:10px 12px;background:' + C.warning + '15;border-radius:8px;color:' + C.warning + ';font-size:13px">' + esc(fu.aiCompareError) + '</div></div>';
    return html;
  }
  const primaryLabel = aiProviderLabel(state.settings.aiProvider);
  const a = sumAiItems(fu.aiResults);
  const b = sumAiItems(fu.aiCompareResults);
  const metrics = [["Calories", "calories", C.calories, ""], ["Protein", "protein", C.protein, "g"], ["Carbs", "carbs", C.carbs, "g"], ["Fat", "fat", C.fat, "g"]];

  html += '<div style="background:' + C.inputBg + ';border:1px solid ' + C.border + ';border-radius:10px;padding:12px 14px">';
  html += '<div style="display:flex;font-size:11px;color:' + C.textMut + ';margin-bottom:8px"><div style="flex:1"></div><div style="width:64px;text-align:right">' + esc(primaryLabel) + '</div><div style="width:64px;text-align:right">Gemini</div></div>';
  metrics.forEach(function(m) {
    const va = a[m[1]], vb = b[m[1]];
    const denom = Math.max(va, vb, 1);
    const pctDiff = Math.abs(va - vb) / denom * 100;
    const notable = pctDiff >= 15;
    html += '<div style="display:flex;align-items:center;padding:4px 0' + (notable ? ';background:' + C.warning + '11;border-radius:6px' : '') + '">' +
      '<div style="flex:1;font-size:13px;color:' + m[2] + '">' + m[0] + '</div>' +
      '<div style="width:64px;text-align:right;font-size:13px;color:' + C.text + '">' + (Math.round(va * 10) / 10) + m[3] + '</div>' +
      '<div style="width:64px;text-align:right;font-size:13px;color:' + C.text + '">' + (Math.round(vb * 10) / 10) + m[3] + '</div>' +
    '</div>';
    if (notable) {
      html += '<div style="text-align:right;font-size:11px;color:' + C.warning + ';margin-bottom:2px">⚠ differs by ' + Math.round(pctDiff) + '%</div>';
    }
  });
  html += '</div>';
  if (fu.aiPhoto) {
    html += '<div style="color:' + C.textMut + ';font-size:11px;margin-top:6px">Gemini’s estimate is text-only — it doesn’t see the attached photo.</div>';
  }
  html += renderAiResultsBlock("Gemini Results:", C.textSec, fu.aiCompareResults, "addAiCompareResult", "addAiCompareResultsCombined");
  html += '</div>';
  return html;
}

function sumAiItems(items) {
  return (items || []).reduce(function(acc, item) {
    return {
      weight: acc.weight + (item.quantity_grams || 0),
      calories: acc.calories + (item.calories || 0),
      protein: acc.protein + (item.protein || 0),
      carbs: acc.carbs + (item.carbs || 0),
      fat: acc.fat + (item.fat || 0),
      fiber: acc.fiber + (item.fiber || 0),
    };
  }, { weight: 0, calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
}

actions.runAIEstimate = async function() {
  const fu = foodUi();
  if (!fu.aiDesc.trim() && !fu.aiPhoto) return;
  fu.aiLoading = true; fu.aiError = null; fu.aiCompareResults = null; fu.aiCompareError = null;
  rerender();

  const set = state.settings;
  const isClaudePrimary = set.aiProvider === "claude-haiku" || set.aiProvider === "claude-sonnet";
  const doCompare = isClaudePrimary && set.compareWithGemini;

  let primaryP;
  if (set.aiProvider === "gemini" && set.geminiApiKey) {
    primaryP = estimateWithGemini(fu.aiDesc, set.geminiApiKey);
  } else if (!set.claudeApiKey) {
    primaryP = Promise.resolve({ error: "No Claude API key set. Add one in Strategy \u2192 AI Settings, or switch provider to Gemini." });
  } else {
    primaryP = estimateWithClaude(fu.aiDesc, fu.aiPhoto, set.aiProvider, set.claudeApiKey);
  }
  const comparePromise = doCompare
    ? (set.geminiApiKey ? estimateWithGemini(fu.aiDesc, set.geminiApiKey) : Promise.resolve({ error: "No Gemini API key set. Add one in Strategy \u2192 AI Settings to enable comparison." }))
    : Promise.resolve(null);

  const results = await Promise.all([primaryP, comparePromise]);
  const result = results[0];
  const compareResult = results[1];
  fu.aiLoading = false;
  if (result.error) { fu.aiError = result.error; }
  else { fu.aiResults = result.data; fu.aiError = null; }
  if (compareResult) {
    if (compareResult.error) { fu.aiCompareError = compareResult.error; }
    else { fu.aiCompareResults = compareResult.data; fu.aiCompareError = null; }
  }
  rerender();
};

        '<div style="color:' + C.text + ';font-size:14px;font-weight:500">' + esc(f.name) + '</div>' +
        '<div class="rowWrap" style="margin-top:4px">' + badge(f.state, f.state === "Cooked" ? C.warning : f.state === "Raw" ? C.success : C.textMut) + badge(f.source) + '<span style="color:' + C.textMut + ';font-size:12px;align-self:center">' + f.calories + ' kcal/100g</span></div>' +
        (f.reason ? '<div style="color:' + C.textMut + ';font-size:11px;margin-top:4px;font-style:italic">' + esc(f.reason) + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
  }

  if (wiz.selectedFood) {
    const f = wiz.selectedFood;
    const g = parseFloat(wiz.weight) || 0;
    const m = calcMacrosForWeight(f, g);
    html += '<div class="card" style="background:' + C.inputBg + ';margin-bottom:0">' +
      '<div style="color:' + C.text + ';font-weight:600;margin-bottom:' + (f.reason ? '4px' : '12px') + '">' + esc(f.name) + '</div>' +
      (f.reason ? '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:12px;font-style:italic">' + esc(f.reason) + '</div>' : '') +
      renderServingControls({
        food: f, weight: wiz.weight, servingBasis: wiz.servingBasis, qty: wiz.qty,
        chipAction: "wizardSetWeight", weightInputId: "wizardWeightInput", weightBind: "wizardWeight",
        qtyInputId: "wizardQtyInput", qtyBind: "wizardQty", qtyReadoutId: "wizardQtyReadout",
        enterAction: "wizardConfirmAdd", useGramsAction: "wizardUseGrams", compact: true,
      }) +
      '<div style="margin-bottom:8px"><span id="wizardPreviewCal" style="color:' + C.calories + ';font-weight:700;font-size:18px">' + m.calories + '</span><span style="color:' + C.calories + ';font-weight:700;font-size:18px"> kcal</span></div>' +
      '<div class="row" style="gap:12px;font-size:13px">' +
        '<span style="color:' + C.protein + '">P: <span id="wizardPreviewPro">' + m.protein + 'g</span></span>' +
        '<span style="color:' + C.carbs + '">C: <span id="wizardPreviewCarb">' + m.carbs + 'g</span></span>' +
        '<span style="color:' + C.fat + '">F: <span id="wizardPreviewFat">' + m.fat + 'g</span></span>' +
        (m.fiber > 0 ? '<span style="color:' + C.textMut + '">Fiber: ' + m.fiber + 'g</span>' : '') +
      '</div></div>';
  }

  html += '<div class="row" style="margin-top:16px">' +
    btn({ label: "Cancel", action: "closeWizard", outline: true, full: true }) +
    btn({ id: "wizardConfirmBtn", label: "Add to Log", action: "wizardConfirmAdd", full: true, disabled: !wiz.selectedFood || !(parseFloat(wiz.weight) > 0) }) +
  '</div>';
  return html;
}

actions.wizardSelect = async function(option) {
  const fu = foodUi();
  const wiz = fu.wizard;
  const config = WIZARD_CONFIGS[fu.wizardType];
  const currentStep = config.steps[wiz.step];
  wiz.selections[currentStep.key] = option;
  const isLastStep = wiz.step === config.steps.length - 1;

  if (option === "Other") {
    wiz.showAI = true;
    rerender();
    return;
  }
  if (isLastStep) {
    wiz.searching = true;
    rerender();
    const parts = [config.label];
    Object.keys(wiz.selections).forEach(function(k) {
      const v = wiz.selections[k];
      if (v !== "Other" && v !== "As-Served") parts.push(v);
    });
    const query = parts.join(" ");
    const usda = await searchUSDA(query);
    const off = await searchOpenFoodFacts(query);
    const merged = deduplicateFoods(usda.concat(off));
    wiz.searchResults = merged;
    wiz.searching = false;
    if (merged.length > 0) { wiz.selectedFood = merged[0]; wiz.weight = ""; wiz.servingBasis = null; wiz.qty = "1"; pendingFocusId = "wizardWeightInput"; }
    rerender();
  } else {
    wiz.step += 1;
    rerender();
  }
};

actions.wizardAiBack = function() { foodUi().wizard.showAI = false; rerender(); };

actions.wizardAiEstimate = async function() {
  const fu = foodUi();
  const wiz = fu.wizard;
  if (!wiz.aiDesc.trim()) return;
  wiz.aiLoading = true; wiz.aiError = null;
  rerender();
  const config = WIZARD_CONFIGS[fu.wizardType];
  const parts = [config.label];
  Object.keys(wiz.selections).forEach(function(k) { if (wiz.selections[k] !== "Other") parts.push(wiz.selections[k]); });
  const fullDesc = parts.join(", ") + ": " + wiz.aiDesc;

  const set = state.settings;
  const isClaudePrimary = set.aiProvider === "claude-haiku" || set.aiProvider === "claude-sonnet";
  const doCompare = isClaudePrimary && set.compareWithGemini && !!set.geminiApiKey;

  let primaryP;
  if (set.aiProvider === "gemini" && set.geminiApiKey) {
    primaryP = estimateWithGemini(fullDesc, set.geminiApiKey);
  } else if (!set.claudeApiKey) {
    primaryP = Promise.resolve({ error: "No Claude API key set. Add one in Strategy \u2192 AI Settings." });
  } else {
    primaryP = estimateWithClaude(fullDesc, null, set.aiProvider, set.claudeApiKey);
  }
  const comparePromise = doCompare ? estimateWithGemini(fullDesc, set.geminiApiKey) : Promise.resolve(null);

  const results = await Promise.all([primaryP, comparePromise]);
  const result = results[0];
  const compareResult = results[1];
  wiz.aiLoading = false;
  if (result.error) { wiz.aiError = result.error; rerender(); return; }
  if (!result.data || result.data.length === 0) { wiz.aiError = "No estimate returned."; rerender(); return; }

  const primaryEst = result.data[0];
  // Only treated as a real second candidate if it actually came back clean -- a compare
  // failure (missing key, network error, etc.) just silently falls back to the single-result
  // flow below rather than blocking on or surfacing a secondary error in this compact screen.
  const compareEst = (compareResult && !compareResult.error && compareResult.data && compareResult.data.length > 0) ? compareResult.data[0] : null;

  if (!compareEst) {
    const estGrams = aiItemGrams(primaryEst);
    wiz.selectedFood = {
      id: "ai_" + Date.now(), name: primaryEst.name || fullDesc, source: "AI Estimate",
      calories: primaryEst.calories, protein: primaryEst.protein, carbs: primaryEst.carbs, fat: primaryEst.fat, fiber: primaryEst.fiber || 0,
      state: wiz.selections.prep || "\u2014",
      baseGrams: estGrams,
      servingSizes: [{ label: round1(estGrams) + "g", grams: estGrams }],
      per100g: false, reason: primaryEst.reason || "",
    };
    wiz.weight = String(estGrams);
    wiz.servingBasis = null; wiz.qty = "1";
    wiz.searchResults = [];
  } else {
    // Both providers came back -- reuse the wizard's existing "pick from a list of candidate
    // foods" screen (the same one regular database search results use) instead of building
    // new UI. That list renders each candidate's calories as a per-100g rate, so convert each
    // estimate to one instead of leaving it as an absolute value for the estimated portion.
    const toPer100gFood = function(est, providerLabel) {
      const grams = aiItemGrams(est);
      const scale = 100 / grams;
      return {
        id: "ai_" + Date.now() + "_" + providerLabel,
        name: (est.name || fullDesc) + " (" + providerLabel + ")",
        source: "AI Estimate", state: wiz.selections.prep || "\u2014",
        calories: Math.round(est.calories * scale), protein: round1(est.protein * scale),
        carbs: round1(est.carbs * scale), fat: round1(est.fat * scale), fiber: round1((est.fiber || 0) * scale),
        per100g: true, reason: est.reason || "",
        servingSizes: [{ label: Math.round(grams) + "g (estimated)", grams: grams }],
      };
    };
    wiz.searchResults = [
      toPer100gFood(primaryEst, aiProviderLabel(set.aiProvider)),
      toPer100gFood(compareEst, "Gemini"),
    ];
    wiz.selectedFood = null;
  }
  wiz.showAI = false;
  rerender();
};

actions.wizardConfirmAdd = function() {
  const fu = foodUi();
  const wiz = fu.wizard;
  if (!wiz.selectedFood) return;
  const w = parseFloat(wiz.weight);
  if (!w || w <= 0) return;
  const now = Date.now();
  if (fu._confirmLock && now - fu._confirmLock < 600) return;
  fu._confirmLock = now;
  const m = calcMacrosForWeight(wiz.selectedFood, w);
  // Same base-anchor rule as confirmAddFood -- freeze before loggedWeight is overwritten.
  addFoodToLog(Object.assign({}, anchorFoodBase(wiz.selectedFood), { loggedWeight: w, loggedMacros: m, timestamp: new Date().toISOString(), wizardUsed: true }));
  fu.query = ""; fu.results = []; fu.historyResults = []; fu.recipeResults = [];
  stepBackOneLevel();
};


// ============================================================
// WEIGHT TAB
// ============================================================
function weightUi() {
  if (!state.ui.weight) state.ui.weight = { input: "", timeRange: "30d", importMsg: "", editingStart: false, startInputDate: "", startInputWeight: "", selectedPoint: null, confirmDeleteDate: null, statsFollowsRange: false,
    // Manual range ("Manual" chip): the applied day count, the popup's in-progress input, and
    // whether the popup is open. panOffsetDays = how many days the window's END sits behind
    // state.date (0 = anchored to the latest); clamped against real data during render.
    manualDays: 0, manualDaysInput: "", showManualPanel: false, panOffsetDays: 0 };
  return state.ui.weight;
}

function renderWeightTab() {
  const wu = weightUi();
  const set = state.settings;
  const todayWeight = state.weights[state.date];
  const unit = set.weightUnit || "lbs";

  let html = card(
    '<h3 class="cardTitle" style="margin-bottom:4px">Log Weight</h3>' +
    '<div style="color:' + C.textMut + ';font-size:13px;margin-bottom:16px">' + (todayWeight ? "Logged: " + todayWeight.weight + " " + todayWeight.unit : "No weight logged today") + '</div>' +
    '<div class="row" style="align-items:center">' +
      textInput({ id: "weightLogInput", value: wu.input, type: "number", placeholder: todayWeight ? String(todayWeight.weight) : "Enter weight", bind: "weightInput", enter: "logWeight", style: "flex:1" }) +
      '<span style="color:' + C.textMut + ';font-size:14px;align-self:center;min-width:24px">' + unit + '</span>' +
      btn({ label: "Log", action: "logWeight" }) +
    '</div>' +
    (todayWeight ? '<div style="margin-top:10px;padding:8px 12px;background:' + C.success + '15;border-radius:8px;display:flex;align-items:center;gap:6px"><span style="color:' + C.success + '">\u2713</span><span style="color:' + C.success + ';font-size:13px">Logged for today: ' + todayWeight.weight + ' ' + todayWeight.unit + '</span></div>' : '')
  );

  const allWeights = Object.keys(state.weights).sort().map(function(d){ return [d, state.weights[d]]; });
  const latestWeight = allWeights.length > 0 ? allWeights[allWeights.length-1][1].weight : null;
  const latestDateStr = allWeights.length > 0 ? allWeights[allWeights.length-1][0] : null;
  const effStartDate = set.startDate || (allWeights.length > 0 ? allWeights[0][0] : null);
  const effStartWeight = (set.startWeight != null && set.startWeight !== "") ? set.startWeight : (allWeights.length > 0 ? allWeights[0][1].weight : null);
  const totalChange = (latestWeight != null && effStartWeight != null) ? round1(latestWeight - effStartWeight) : null;
  const daysSinceStart = (effStartDate && latestDateStr) ? Math.max(1, (parseDateStr(latestDateStr) - parseDateStr(effStartDate)) / 86400000) : null;
  const avgDailySinceStart = (daysSinceStart != null && totalChange != null) ? Math.round((totalChange / daysSinceStart) * 100) / 100 : null;
  const weeklyChangeSinceStart = (daysSinceStart != null && totalChange != null) ? round1(totalChange / (daysSinceStart / 7)) : null;

  // Chart data -- computed here (moved up from below the stat cards) so the Avg Daily/Weekly
  // Change cards can use the exact same filtered window the chart itself is showing. Since
  // panning, the window is a [startMs, endMs] pair rather than just a lower cutoff: sliding
  // back in time means entries NEWER than the window's end drop out too. The offset is
  // re-clamped against the actual data every render, so deleting weigh-ins (or switching to a
  // wider range) can never leave the window stranded past the ends of the data.
  const rangeDays = weightRangeDays(wu.timeRange, wu.manualDays);
  const earliestDateStr = allWeights.length > 0 ? allWeights[0][0] : null;
  wu.panOffsetDays = clampWeightPanOffset(wu.panOffsetDays || 0, rangeDays, earliestDateStr, state.date);
  const bounds = weightChartWindowBounds(wu.timeRange, wu.manualDays, wu.panOffsetDays, state.date);
  const chartData = allWeights.filter(function(w){ const t = parseDateStr(w[0]).getTime(); return t >= bounds.startMs && t <= bounds.endMs; })
    .map(function(w){ return { date: w[0], weight: w[1].weight }; });
  const maxPan = clampWeightPanOffset(Infinity, rangeDays, earliestDateStr, state.date);
  const fmtWinDay = function(ms) { return new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const windowLabel = rangeDays ? fmtWinDay(bounds.startMs) + " – " + fmtWinDay(bounds.endMs) : "";

  // Avg Daily / Weekly Change normally reflect "since your starting point" (effStartDate/Weight
  // above) -- the original, always-on calculation. Tapping a 7d/30d/90d/6m/All chip arms
  // wu.statsFollowsRange and switches these two cards (only these two -- Current Weight/Total
  // Change above are unaffected) to the currently charted window instead, via the pure
  // weightRangeStats helper over the same chartData the chart renders from. Tapping the Current
  // Weight card disarms it, reverting to the starting-point numbers without touching which
  // range the chart itself is showing.
  let statsAvgDaily = avgDailySinceStart, statsWeekly = weeklyChangeSinceStart;
  let statsCaption = effStartDate ? "since " + dayLabel(effStartDate) : null;
  if (wu.statsFollowsRange) {
    const rangeStats = weightRangeStats(chartData);
    statsAvgDaily = rangeStats ? rangeStats.avgDaily : null;
    statsWeekly = rangeStats ? rangeStats.weeklyChange : null;
    // A panned window isn't "the last N days" any more -- caption the actual dates instead.
    statsCaption = (wu.panOffsetDays > 0 ? windowLabel : weightStatsRangeLabel(wu.timeRange, wu.manualDays)) + (rangeStats ? "" : " \u2014 not enough data in range");
  }

  if (latestWeight != null) {
    html += '<div class="row" style="margin-bottom:16px">' +
      '<div class="statCard" style="cursor:pointer;min-width:0" data-action="resetWeightStatsRange">' +
        '<div class="statLabel">Current Weight</div>' +
        '<div class="statValue" style="color:' + C.text + '">' + latestWeight + ' ' + unit + '</div>' +
        (wu.statsFollowsRange ? '<div style="color:' + C.textMut + ';font-size:10px;margin-top:4px">tap to use starting point</div>' : '') +
      '</div>' +
      '<div class="statCard" style="cursor:pointer;min-width:0" data-action="toggleStartEdit">' +
        '<div class="statLabel">Total Change</div>' +
        '<div class="statValue" style="color:' + (totalChange != null ? (totalChange <= 0 ? C.success : C.danger) : C.text) + '">' + (totalChange != null ? (totalChange > 0 ? "+" : "") + totalChange + " " + unit : "\u2014") + '</div>' +
        '<div style="color:' + C.textMut + ';font-size:10px;margin-top:4px">' + (effStartDate ? "since " + esc(dayLabel(effStartDate)) + " \u2022 tap to edit" : "tap to set start") + '</div>' +
      '</div>' +
    '</div>';
  }

  if (wu.editingStart) {
    html += card(
      '<h3 class="cardTitle" style="margin-bottom:12px">Starting Point</h3>' +
      '<div style="margin-bottom:12px"><label class="label">Starting Date</label>' + textInput({ value: wu.startInputDate, type: "date", bind: "startInputDate", enter: "saveStartPoint" }) + '</div>' +
      '<div style="margin-bottom:16px"><label class="label">Starting Weight (' + unit + ')</label>' + textInput({ value: wu.startInputWeight, type: "number", bind: "startInputWeight", enter: "saveStartPoint" }) + '</div>' +
      '<div class="row">' +
        btn({ label: "Reset to Auto", action: "clearStartPoint", outline: true, small: true }) +
        btn({ label: "Cancel", action: "toggleStartEdit", outline: true, small: true }) +
        btn({ label: "Save", action: "saveStartPoint", small: true }) +
      '</div>'
    );
  }

  if (statsAvgDaily != null || statsWeekly != null || wu.statsFollowsRange) {
    html += '<div class="row" style="margin-bottom:4px">' +
      statCard("Avg Daily", statsAvgDaily != null ? (statsAvgDaily > 0 ? "+" : "") + statsAvgDaily + " " + unit + "/day" : "\u2014", statsAvgDaily != null ? (statsAvgDaily <= 0 ? C.success : C.danger) : C.text) +
      statCard("Weekly Change", statsWeekly != null ? (statsWeekly > 0 ? "+" : "") + statsWeekly + " " + unit : "\u2014", statsWeekly != null ? (statsWeekly <= 0 ? C.success : C.danger) : C.text) +
    '</div>';
    if (statsCaption) html += '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:16px;text-align:center">' + esc(statsCaption) + '</div>';
  }

  // Gated on ALL the data, not the current window: a panned/narrow window with nothing in it
  // must still show the card (with its placeholder), or panning into a gap would make the
  // range chips and pan controls vanish with no way back.
  if (allWeights.length > 1) {
    const selPoint = wu.selectedPoint ? chartData.find(function(d){ return d.date === wu.selectedPoint; }) : null;
    // Six chips on one line: tighter padding/font/gap than the .chip default so Manual fits.
    const chipStyle = 'flex:1;text-align:center;padding:6px 0;font-size:11px;min-width:0;white-space:nowrap';
    let histInner = '<h3 class="cardTitle" style="margin-bottom:4px">Weight History</h3>' +
      '<div class="row" style="gap:4px">' +
        ["7d","30d","90d","6m","all"].map(function(r) {
          return '<button class="chip' + (wu.timeRange === r ? ' active' : '') + '" data-action="setWeightRange" data-arg="' + r + '" style="' + chipStyle + '">' + (r === "all" ? "All" : r) + '</button>';
        }).join('') +
        // Shows its applied day count while active ("45d"), so the setting is visible at a
        // glance; tapping it again reopens the popup to change the count.
        '<button class="chip' + (wu.timeRange === "manual" ? ' active' : '') + '" data-action="openManualRange" style="' + chipStyle + '">' + (wu.timeRange === "manual" && rangeDays ? rangeDays + "d" : "Manual") + '</button>' +
      '</div>' +
      renderManualRangePanel(wu) +
      renderWeightPanRow(wu, rangeDays, maxPan, windowLabel) +
      renderSelectedWeightSlot(selPoint, wu, unit) +
      (chartData.length > 0
        ? renderWeightChart(chartData, set.goalWeight, wu.selectedPoint)
        : '<div data-panzone="weight" style="height:220px;display:flex;align-items:center;justify-content:center;color:' + C.textMut + ';font-size:13px">No weigh-ins in this window</div>');
    html += card(histInner);
  } else {
    html += card('<div style="text-align:center;padding:30px"><div style="font-size:28px;margin-bottom:8px">\u{1F4C8}</div><div style="color:' + C.textMut + ';font-size:14px">Log at least 2 days of weight to see your chart</div></div>');
  }

  html += card(
    '<h3 class="cardTitle" style="margin-bottom:8px">Import Data</h3>' +
    '<div style="color:' + C.textMut + ';font-size:13px;margin-bottom:12px">Import weight history from Renpho CSV export</div>' +
    '<input type="file" accept=".csv" id="renphoFileInput" data-change="renphoImport" style="display:none">' +
    btn({ label: "\u{1F4C1} Import Renpho CSV", action: "clickRenphoImport", outline: true, small: true }) +
    (wu.importMsg ? '<div style="margin-top:8px;padding:8px 12px;background:' + C.success + '15;border-radius:8px;color:' + C.success + ';font-size:13px">' + esc(wu.importMsg) + '</div>' : '')
  );

  return html;
}

// X pixel position for each date, proportional to its real elapsed time from the first date --
// so missed days leave a proportional gap. dates is ascending "YYYY-MM-DD" strings; returns an
// array of x pixels from x0 (left edge) across plotWidth. Degenerate spans (one date, or all
// the same) collapse to x0. Pure and date-only, so it's unit-tested directly.
function weightChartXPositions(dates, x0, plotWidth) {
  const t0 = parseDateStr(dates[0]).getTime();
  const tSpan = parseDateStr(dates[dates.length - 1]).getTime() - t0;
  return dates.map(function(d) {
    if (tSpan <= 0) return x0;
    return x0 + ((parseDateStr(d).getTime() - t0) / tSpan) * plotWidth;
  });
}

// The tapped weigh-in, shown in the gap between the range chips and the chart (moved up from
// below the chart, 2026-08-10).
//
// The slot is a FIXED height and is always rendered, empty state included. That's the whole
// point: the readout used to appear below the chart only once a point was selected, so every
// tap grew the card and shoved everything under it down the screen -- and every dismissal
// snapped it back. Reserving the space unconditionally means selecting, changing and clearing
// a point never moves the chart by a pixel, so you can walk along the line and read off days
// without it sliding around under your thumb.
//
// All three states (nothing selected / a point selected / confirming a delete) are one row at
// the same height for the same reason -- the delete confirmation replaces the readout in place
// rather than expanding underneath it.
const SELECTED_WEIGHT_SLOT_H = 44;
function renderSelectedWeightSlot(selPoint, wu, unit) {
  const wrap = function(content) {
    return '<div style="height:' + SELECTED_WEIGHT_SLOT_H + 'px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden">' + content + '</div>';
  };
  if (!selPoint) {
    return wrap('<span style="color:' + C.textMut + ';font-size:12px">Tap the chart to see a day’s weight</span>');
  }
  // "All" can span multiple years, where the usual weekday/month/day label is ambiguous about
  // which year a point falls in -- every other range chip is well under a year, so dayLabel's
  // existing format stays unambiguous there.
  const selDateLabel = wu.timeRange === "all"

// › comes back toward the latest weigh-in (offset down, disabled once there). Tapping the
// dates while panned snaps straight back to the latest window.
function renderWeightPanRow(wu, rangeDays, maxPan, windowLabel) {
  if (!rangeDays) return ''; // "all" shows everything -- nothing to pan
  const btnStyle = 'background:#1E2640;border:none;border-radius:8px;color:' + C.text + ';font-size:15px;line-height:1;padding:5px 16px;cursor:pointer';
  const canBack = wu.panOffsetDays < maxPan, canFwd = wu.panOffsetDays > 0;

    '<button data-action="panWeightChart" data-arg="back"' + (canBack ? ' style="' + btnStyle + '"' : ' disabled style="' + btnStyle + ';opacity:0.35"') + '>‹</button>' +
    '<span' + (wu.panOffsetDays > 0 ? ' data-action="resetWeightPan" style="cursor:pointer;' : ' style="') + 'color:' + C.textMut + ';font-size:11px;text-align:center;min-width:0">' +
      esc(windowLabel) + (wu.panOffsetDays > 0 ? ' · tap for latest' : '') +
    '</span>' +
    '<button data-action="panWeightChart" data-arg="fwd"' + (canFwd ? ' style="' + btnStyle + '"' : ' disabled style="' + btnStyle + ';opacity:0.35"') + '>›</button>' +
  '</div>';
}

// Tap targets for the weight chart: one full-plot-height vertical band per point, each running
// from the midpoint to its left neighbour to the midpoint to its right (clamped to the plot).
//
// Replaces a transparent r=12 circle centred on each dot (2026-08-10). That circle required
// hitting within ~12 units of the dot in BOTH axes on a chart drawn at 460 units wide and
// scaled down to phone width, so a tap that landed above or below the line -- or in the gap
// between two dots -- did nothing at all, which reads as the chart ignoring you. Bands fix the
// real problem, which was dead space rather than size: every pixel of the plot now belongs to
// exactly one point, vertical position stops mattering entirely, and the point selected is
// always the nearest one horizontally.
//
// Deliberately NOT given a minimum width. Widening them past the midpoints would make adjacent
// bands overlap, and on overlap the later-painted band wins -- so a tap right next to one dot
// could select its neighbour. On a dense range the bands are narrow because the points really
// are that close together; nearest-point is still the best answer available there.
// Pure (numbers in, numbers out), so it's unit-tested directly.
function weightChartHitBands(xs, x0, x1) {
  return xs.map(function(x, i) {
    const rawLeft = i === 0 ? x0 : (xs[i - 1] + x) / 2;
    const rawRight = i === xs.length - 1 ? x1 : (x + xs[i + 1]) / 2;
    const left = Math.max(x0, Math.min(rawLeft, x1));
    const right = Math.max(x0, Math.min(rawRight, x1));
    return { x: left, width: Math.max(0, right - left) };
  });
}

// Millisecond cutoff for a "7d"/"30d"/"90d"/"6m"/"all" chip, as a real calendar-day boundary --
// N calendar days ending on (and including) referenceDateStr, at local midnight. "all" (or
// anything unrecognized) returns 0, admitting everything.
//
// Fixed 2026-07: this used to be `Date.now() - N*86400000` compared against each entry's
// local-midnight timestamp. Date.now() is a moving clock-time, not a calendar boundary, so the
// cutoff fell at an arbitrary time WITHIN a day rather than at midnight -- whichever calendar
// day that happened to slice through got silently excluded, depending purely on what time of
// day "now" was when the chart was viewed (reported as "7d seems to start from Monday": if
// today is Sunday, the boundary lands partway through the Sunday one week back, which always
// sorts after that Sunday's own midnight timestamp, so that Sunday drops out and the window
// effectively starts the following Monday). setDate() (not raw ms subtraction) so this is also
// correct across DST transitions, which are 23 or 25 hours, not a clean 24.
function weightChartCutoff(timeRange, referenceDateStr) {
  return weightChartWindowBounds(timeRange, 0, 0, referenceDateStr).startMs;
}

// How many calendar days a range spans, or null for an unbounded one ("all" -- and "manual"
// before a day count has actually been applied, so an un-configured Manual chip behaves like
// All rather than showing an arbitrary guess).
function weightRangeDays(timeRange, manualDays) {
  const named = { "7d": 7, "30d": 30, "90d": 90, "6m": 180 }[timeRange];
  if (named) return named;
  if (timeRange === "manual") {
    const n = parseInt(manualDays, 10);
    if (n >= 2) return n;
  }
  return null;
}

// The chart's visible window as inclusive [startMs, endMs] local-midnight bounds: N calendar
// days ending panOffsetDays back from referenceDateStr. Same calendar-day arithmetic rules as
// the original cutoff (see the comment above weightChartCutoff): setDate() steps, never raw ms
// subtraction, so DST's 23/25-hour days can't shift the boundary. Unbounded ranges admit
// everything ({0, Infinity}). Pure, so it's unit-tested directly.
function weightChartWindowBounds(timeRange, manualDays, panOffsetDays, referenceDateStr) {
  const days = weightRangeDays(timeRange, manualDays);
  if (!days) return { startMs: 0, endMs: Infinity };
  const end = parseDateStr(referenceDateStr);
  end.setDate(end.getDate() - Math.max(0, parseInt(panOffsetDays, 10) || 0));
  const start = new Date(end.getTime());
  start.setDate(start.getDate() - (days - 1)); // inclusive of the end day itself -> N calendar days total
  return { startMs: start.getTime(), endMs: end.getTime() };
}

// Clamp a pan offset to [0, span - (days-1)]: 0 = anchored to the latest, and the far limit
// puts the earliest weigh-in at the LEFT edge of the window -- panning further back than that
// only shows guaranteed-empty space. Math.round on the day count because a span crossing a
// DST transition is not an exact multiple of 86400000ms. Pure, unit-tested.
function clampWeightPanOffset(offset, days, earliestDateStr, referenceDateStr) {
  if (!days || !earliestDateStr) return 0;
  const spanDays = Math.round((parseDateStr(referenceDateStr) - parseDateStr(earliestDateStr)) / 86400000);
  const maxOffset = Math.max(0, spanDays - (days - 1));
  return Math.min(Math.max(0, offset), maxOffset);
}

// First-vs-last net change across a chart's currently-filtered window, expressed the same way
// the starting-point calculation is (avg/day, and per-week). null when there isn't enough data
// in the window to say anything (fewer than 2 points). data: ascending [{date, weight}].
function weightRangeStats(data) {
  if (!data || data.length < 2) return null;
  const first = data[0], last = data[data.length - 1];
  const days = Math.max(1, (parseDateStr(last.date) - parseDateStr(first.date)) / 86400000);
  const change = last.weight - first.weight;
  return { avgDaily: Math.round((change / days) * 100) / 100, weeklyChange: round1(change / (days / 7)) };
}
function weightStatsRangeLabel(timeRange, manualDays) {
  if (timeRange === "manual") {
    const n = parseInt(manualDays, 10);
    return n >= 2 ? "last " + n + " days" : "custom range";
  }
  return { "7d": "last 7 days", "30d": "last 30 days", "90d": "last 90 days", "6m": "last 6 months", "all": "all time" }[timeRange] || "selected range";
}

function renderWeightChart(data, goalWeight, selectedDate) {
  const w = 460, h = 200, padL = 36, padR = 10, padT = 10, padB = 24;
  const weights = data.map(function(d){ return d.weight; });
  let minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
  if (goalWeight) { minW = Math.min(minW, goalWeight); maxW = Math.max(maxW, goalWeight); }
  const pad = (maxW - minW) * 0.15 || 2;
  minW -= pad; maxW += pad;
  // X is proportional to actual elapsed time, not evenly spaced by index (see
  // weightChartXPositions) -- a gap where a day or week of weigh-ins was missed shows as a real
  // horizontal gap instead of sitting as close as two consecutive days.
  const xs = weightChartXPositions(data.map(function(d){ return d.date; }), padL, w - padL - padR);
  const yScale = function(val) { return padT + (1 - (val - minW) / (maxW - minW)) * (h - padT - padB); };
  const xScale = function(i) { return xs[i]; };

  let path = "";
  data.forEach(function(d, i) {
    const x = xScale(i), y = yScale(d.weight);
    path += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  });

  let dots = "";
  data.forEach(function(d, i) {
    const cx = xScale(i).toFixed(1), cy = yScale(d.weight).toFixed(1);
    const isSel = d.date === selectedDate;
    dots += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (isSel ? 6 : 3) + '" fill="' + (isSel ? C.warning : C.primary) + '"' + (isSel ? ' stroke="#fff" stroke-width="2"' : '') + ' style="pointer-events:none"></circle>';
  });

  // The tap targets (see weightChartHitBands). Painted LAST so they sit above the line and the
  // dots and catch every tap in the plot; they're transparent, so nothing changes visually.
  // A selected band also draws a faint vertical marker, which is what makes it obvious which
  // column you actually hit on a dense range.
  let hitAreas = "";
  const plotTop = padT, plotH = h - padT - padB;
  const bands = weightChartHitBands(xs, padL, w - padR);
  data.forEach(function(d, i) {
    const b = bands[i];
    if (b.width <= 0) return;
    if (d.date === selectedDate) {
      hitAreas += '<line x1="' + xScale(i).toFixed(1) + '" y1="' + plotTop + '" x2="' + xScale(i).toFixed(1) + '" y2="' + (plotTop + plotH) + '" stroke="' + C.warning + '" stroke-width="1" stroke-dasharray="2,3" style="pointer-events:none"></line>';
    }
    hitAreas += '<rect x="' + b.x.toFixed(1) + '" y="' + plotTop + '" width="' + b.width.toFixed(1) + '" height="' + plotH + '" fill="transparent" data-action="selectWeightPoint" data-arg="' + d.date + '" style="cursor:pointer"></rect>';
  });

  let gridLines = "";
  const numGrid = 4;
  for (let g = 0; g <= numGrid; g++) {
    const y = padT + (g / numGrid) * (h - padT - padB);
    gridLines += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w-padR) + '" y2="' + y.toFixed(1) + '" stroke="' + C.border + '" stroke-width="1" stroke-dasharray="3,3"></line>';
  }

  let xLabels = "";
  const labelEvery = Math.max(1, Math.ceil(data.length / 5));
  data.forEach(function(d, i) {
    if (i % labelEvery === 0 || i === data.length - 1) {
      const lbl = parseDateStr(d.date).toLocaleDateString("en-US", { month: "short", day: "numeric" });
      xLabels += '<text x="' + xScale(i).toFixed(1) + '" y="' + (h-6) + '" font-size="10" fill="' + C.textMut + '" text-anchor="middle">' + lbl + '</text>';
    }
  });

  let yLabels = "";
  for (let g = 0; g <= numGrid; g++) {
    const val = maxW - (g / numGrid) * (maxW - minW);
    const y = padT + (g / numGrid) * (h - padT - padB);
    yLabels += '<text x="4" y="' + (y+3).toFixed(1) + '" font-size="10" fill="' + C.textMut + '">' + Math.round(val) + '</text>';
  }

  let goalLine = "";
  if (goalWeight && goalWeight >= minW && goalWeight <= maxW) {
    const gy = yScale(goalWeight);
    goalLine = '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (w-padR) + '" y2="' + gy.toFixed(1) + '" stroke="' + C.success + '" stroke-width="1.5" stroke-dasharray="5,5"></line>' +
      '<text x="' + (w-padR) + '" y="' + (gy-4).toFixed(1) + '" font-size="10" fill="' + C.success + '" text-anchor="end">Goal: ' + goalWeight + '</text>';
  }

  return '<div style="width:100%;overflow-x:auto" data-panzone="weight"><svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:220px" preserveAspectRatio="xMidYMid meet">' +
    gridLines + yLabels + xLabels + goalLine +
    '<path d="' + path + '" fill="none" stroke="' + C.primary + '" stroke-width="2"></path>' +
    dots + hitAreas +
  '</svg></div>';
}

function parseCsvLine(line) {
  const result = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }
        else { inQuotes = false; }
      } else { cur += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { result.push(cur); cur = ""; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

changeActions.renphoImport = function(el) {
  const file = el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const text = ev.target.result;
      const lines = text.split("\n").filter(function(l){ return l.trim(); });
      const cols0 = parseCsvLine(lines[0]).map(function(h){ return h.toLowerCase(); });
      const dateIdx = cols0.findIndex(function(h){ return h.indexOf("time") >= 0 || h.indexOf("date") >= 0; });
      const weightIdx = cols0.findIndex(function(h){ return h.indexOf("weight") >= 0; });
      if (dateIdx < 0 || weightIdx < 0) { weightUi().importMsg = "Could not detect date/weight columns"; rerender(); return; }
      let count = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        if (cols.length <= Math.max(dateIdx, weightIdx)) continue;
        const dateStr = cols[dateIdx].trim().replace(/"/g, "");
        const w = parseFloat(cols[weightIdx].trim().replace(/"/g, ""));
        if (!w || isNaN(w)) continue;
        let d;
        if (dateStr.indexOf("/") >= 0) {
          const parts = dateStr.split(/[\s/]/);
          if (parts[2] && parts[2].length === 4) d = parts[2] + "-" + parts[0].padStart(2,"0") + "-" + parts[1].padStart(2,"0");
          else d = fmtDate(new Date(dateStr));
        } else {
          d = fmtDate(new Date(dateStr));
        }
        if (d && d !== "NaN-NaN-NaN" && !state.weights[d]) {
          state.weights[d] = { weight: w, unit: "lbs", timestamp: new Date(dateStr).toISOString(), updatedAt: new Date().toISOString() };
          count++;
        }
      }
      saveWeights();
      weightUi().importMsg = "Imported " + count + " weight entries";
      rerender();
    } catch (e) {
      weightUi().importMsg = "Error parsing file. Check format.";
      rerender();
    }
  };
  reader.readAsText(file);
  el.value = "";
};

// Read-only, and only once there's actually something to show. Without it the fact that past
// days are scored against past targets is invisible magic -- this is what makes "why does an
// old day say I hit my goal when my goal is 2,800?" answerable at a glance.
function renderTargetHistoryBlock() {
  const dates = Object.keys(state.targetHistory || {}).sort();
  if (dates.length === 0) return '';
  let html = '<div style="margin-top:20px;padding-top:16px;border-top:1px solid ' + C.border + '">' +
    '<label class="label" style="margin-bottom:8px">Target History</label>' +
    '<div style="color:' + C.textMut + ';font-size:11px;margin-bottom:10px">Past days are scored against the goal that was standing on that day, so changing your target now doesn’t rewrite how those days read.</div>';
  // Newest first, each row covering "from this date until the next change".
  for (let i = dates.length - 1; i >= 0; i--) {
    const t = state.targetHistory[dates[i]];
    const isCurrent = i === dates.length - 1;
    const until = isCurrent ? "now" : dayLabel(dates[i + 1]);
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12px">' +
      '<span style="color:' + (isCurrent ? C.textSec : C.textMut) + '">' + esc(dayLabel(dates[i])) + ' → ' + esc(until) + '</span>' +
      '<span style="color:' + (isCurrent ? C.calories : C.textMut) + ';font-weight:600">' + (t.calorieTarget || 0).toLocaleString() + ' kcal</span>' +
